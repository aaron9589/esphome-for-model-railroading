# secrets.yaml — keep this file private. Never commit it to source control.
# These values are referenced in your board YAML files using !secret <key>.
# See first-board-setup-guide.md Step 4 for instructions on filling these in.

wifi_ssid: "your-wifi-network-name"
wifi_password: "your-wifi-password"

# IP address of the PC running EMQX. Find it by running: ipconfig
mqtt_broker: "192.168.1.x"

ota_password: "choose-any-password-for-over-the-air-updates"