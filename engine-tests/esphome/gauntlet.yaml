    - mqtt.publish:
        topic: trains/track/sensor/P1/Moving
        payload: !lambda |-
          return id(p1_throw_closed).is_running() || id(p1_throw_thrown).is_running() ? "ACTIVE" : "INACTIVE";
        retain: true
        qos: 2
    - mqtt.publish:
        topic: trains/track/sensor/P2/Moving
        payload: !lambda |-
          return id(p2_throw_closed).is_running() || id(p2_throw_thrown).is_running() ? "ACTIVE" : "INACTIVE";
        retain: true
        qos: 2
    - mqtt.publish:
        topic: "trains/track/signalmast/Left Bridge/State"
        payload: !lambda |-
          switch (id(left_bridge_aspect)) {
            case 0: return "R292";
            case 1: return "R281";
            default: return "";
          }
        retain: true
        qos: 2
    - mqtt.publish:
        topic: "trains/track/signalmast/Right Bridge/State"
        payload: !lambda |-
          switch (id(right_bridge_aspect)) {
            case 0: return "R292";
