          }
        retain: true
        qos: 2
    - mqtt.publish:
        topic: "trains/track/signalmast/Bridge Exit/State"
        payload: !lambda |-
          switch (id(bridge_exit_aspect)) {
            case 0: return "Stop";
            case 1: return "Clear";
            default: return "";
          }
        retain: true
