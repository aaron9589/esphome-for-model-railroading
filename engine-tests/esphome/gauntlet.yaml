                payload: "ACTIVE"
                retain: true
                qos: 2
      - if:
          condition:
            lambda: 'return !id(p2_throw_closed).is_running();'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/P2/Moving
                payload: INACTIVE
                retain: true
                qos: 2
  - id: left_bridge_show
    mode: restart
    parameters:
      restart_effects: bool
    then:
      - if:
          condition:
            lambda: 'return restart_effects;'
          then:
            - mqtt.publish:
                topic: "trains/track/signalmast/Left Bridge/State"
                payload: !lambda |-
                  switch (id(left_bridge_aspect)) {
                    case 0: return "R292";
                    case 1: return "R281";
                    default: return "";
                  }
                retain: true
                qos: 2
      - if:
          condition:
            lambda: 'return id(left_bridge_aspect) == -2;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Left Bridge | Dark"
                      level: INFO
                      tag: signal_mast
            - light.turn_off: left_bridge_lamp_0
            - light.turn_off: left_bridge_lamp_1
      - if:
          condition:
            lambda: 'return id(left_bridge_aspect) == 0;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Left Bridge | Stop"
                      level: INFO
                      tag: signal_mast
            - light.turn_on:
                id: left_bridge_lamp_0
                brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'
                effect: "None"
            - light.turn_off: left_bridge_lamp_1
      - if:
          condition:
            lambda: 'return id(left_bridge_aspect) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Left Bridge | Clear"
                      level: INFO
                      tag: signal_mast
            - light.turn_off: left_bridge_lamp_0
            - light.turn_on:
                id: left_bridge_lamp_1
                brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'
                effect: "None"
  - id: right_bridge_show
    mode: restart
    parameters:
      restart_effects: bool
    then:
      - if:
          condition:
            lambda: 'return restart_effects;'
          then:
            - mqtt.publish:
                topic: "trains/track/signalmast/Right Bridge/State"
                payload: !lambda |-
                  switch (id(right_bridge_aspect)) {
                    case 0: return "R292";
                    case 1: return "R281";
                    default: return "";
                  }
                retain: true
                qos: 2
      - if:
          condition:
            lambda: 'return id(right_bridge_aspect) == -2;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Right Bridge | Dark"
                      level: INFO
                      tag: signal_mast
            - light.turn_off: right_bridge_lamp_0
            - light.turn_off: right_bridge_lamp_1
      - if:
          condition:
            lambda: 'return id(right_bridge_aspect) == 0;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Right Bridge | Stop"
                      level: INFO
                      tag: signal_mast
            - light.turn_on:
                id: right_bridge_lamp_0
                brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'
                effect: "None"
            - light.turn_off: right_bridge_lamp_1
      - if:
          condition:
            lambda: 'return id(right_bridge_aspect) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Right Bridge | Clear"
                      level: INFO
                      tag: signal_mast
            - light.turn_off: right_bridge_lamp_0
            - light.turn_on:
                id: right_bridge_lamp_1
                brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'
                effect: "None"
  - id: bridge_exit_show
    mode: restart
    parameters:
      restart_effects: bool
    then:
      - lambda: |-
          switch (id(bridge_exit_aspect)) {
            case 0: ESP_LOGI("signal_mast", "%s", "Bridge Exit | Stop"); break;
            case 1: ESP_LOGI("signal_mast", "%s", "Bridge Exit | Clear"); break;
            default: break;
          }
      - mqtt.publish:
          topic: "trains/track/signalmast/Bridge Exit/State"
          payload: !lambda |-
            switch (id(bridge_exit_aspect)) {
              case 0: return "Stop";
              case 1: return "Clear";
              default: return "";
            }
          retain: true
          qos: 2

light:
  - platform: monochromatic
    output: left_bridge_lamp_0_output
    id: left_bridge_lamp_0
    name: "Left Bridge Red"
    internal: true
    default_transition_length: 0s
    effects:
      - lambda:
          name: Blink
          update_interval: 16ms
          lambda: |-
            static uint32_t started = 0;
            if (initial_run) started = millis();
            float on_s = id(signal_blink_lit).state;
            float off_s = id(signal_blink_dark).state;
            if (on_s < 0.05f) on_s = 0.05f;
            if (off_s < 0.05f) off_s = 0.05f;
            const uint32_t on_ms = uint32_t(on_s * 1000.0f);
            const uint32_t off_ms = uint32_t(off_s * 1000.0f);
            const uint32_t elapsed = (millis() - started) % (on_ms + off_ms);
            const float level = elapsed < on_ms ? id(signal_blink_bright).state / 100.0f : 0.0f;
            auto call = it.turn_on();
            call.set_brightness(level);
            call.set_state(true);
            call.set_transition_length(0);
            call.set_publish(false);
            call.set_save(false);
            call.perform();
      - lambda:
          name: Pulse
          update_interval: 16ms
          lambda: |-
            static uint32_t last_ms = 0;
            static float phase = 0.0f;
            float pulse_s = id(signal_pulse_span).state;
            float pause_s = id(signal_pulse_wait).state;
            if (pulse_s < 0.05f) pulse_s = 0.05f;
            if (pause_s < 0.0f) pause_s = 0.0f;
            const float cycle_s = pulse_s + pause_s;
            const uint32_t now = millis();
            if (initial_run) {
              last_ms = now;
              phase = 0.0f;
            }
            const float dt = float(now - last_ms) / 1000.0f;
            last_ms = now;
            phase += dt / cycle_s;
            phase -= floorf(phase);
            const float t = phase * cycle_s;
            const float half = pulse_s * 0.5f;
            float wave = 0.0f;
            if (t < half) wave = 1.0f - t / half;
            else if (t >= half + pause_s) wave = (t - half - pause_s) / half;
            const float level = (id(signal_pulse_peak).state / 100.0f) * wave;
            auto call = it.turn_on();
            call.set_brightness(level);
            call.set_state(true);
            call.set_transition_length(0);
            call.set_publish(false);
            call.set_save(false);
            call.perform();
