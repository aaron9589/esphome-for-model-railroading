    auto_detach_time: 0s
    transition_length: 10s

switch:
  - platform: template
    id: field_logic
    name: "Field logic"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: logic_auto
    name: "Auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
