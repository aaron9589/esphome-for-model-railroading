    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: p2_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "P2 Reverse Position"
    id: p2_servo_endpoint_reverse
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
