    pin: GPIO23
    id: end_a_led
    name: "End A LED"
    internal: true
  - platform: gpio
    pin:
      number: GPIO15
    id: local_lamp_lamp
    name: "Local lamp"
    restore_mode: ALWAYS_OFF

script:
  - id: p1_throw_closed
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(p1_thrown) = false;
          p1_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "P1 -> CLOSED (normal)"
          level: INFO
          tag: point_control
      - mqtt.publish:
          topic: trains/track/sensor/P1/Moving
          payload: ACTIVE
          retain: true
          qos: 2
      - servo.write:
          id: p1_servo
          level: !lambda 'return id(p1_servo_endpoint_normal).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: p1_servo
          level: !lambda 'return id(p1_servo_endpoint_normal_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/P1/Thrown
                payload: "INACTIVE"
                retain: true
                qos: 2
      - if:
          condition:
            lambda: 'return !id(p1_throw_thrown).is_running();'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/P1/Moving
                payload: INACTIVE
                retain: true
                qos: 2
  - id: p1_throw_thrown
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(p1_thrown) = true;
          p1_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "P1 -> THROWN (reverse)"
          level: INFO
          tag: point_control
      - mqtt.publish:
          topic: trains/track/sensor/P1/Moving
          payload: ACTIVE
          retain: true
          qos: 2
      - servo.write:
          id: p1_servo
          level: !lambda 'return id(p1_servo_endpoint_reverse).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: p1_servo
          level: !lambda 'return id(p1_servo_endpoint_reverse_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/P1/Thrown
                payload: "ACTIVE"
                retain: true
                qos: 2
      - if:
          condition:
            lambda: 'return !id(p1_throw_closed).is_running();'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/P1/Moving
                payload: INACTIVE
                retain: true
                qos: 2
  - id: p1_latch_1
    mode: queued
    parameters:
      force: bool
    then:
      - wait_until:
          condition:
            lambda: 'return id(p1_button_1).has_state() && !id(p1_throw_closed).is_running() && !id(p1_throw_thrown).is_running();'
      - lambda: |-
          bool want = id(p1_button_1).state;
          // A lock (remote or a rule's) holds the point where it is.
          if (id(p1_locked) || id(p1_field_locked)) want = id(p1_thrown);
          bool moving = want != id(p1_thrown);
          if (!moving && !force) return;
          if (want) id(p1_throw_thrown).execute(moving);
          else id(p1_throw_closed).execute(moving);
  - id: p2_throw_closed
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(p2_thrown) = false;
          p2_thrown->update();
          global_preferences->sync();
      - logger.log:
