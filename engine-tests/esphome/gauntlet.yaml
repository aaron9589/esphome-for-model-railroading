            const uint32_t now = millis();
            if (initial_run) {
              last_ms = now;
              phase = 0.0f;
            }
            const float dt = float(now - last_ms) / 1000.0f;
            last_ms = now;
            phase += dt / cycle_s;
            phase -= floorf(phase);
            const float t = phase * cycle_s;
            const float half = pulse_s * 0.5f;
            float wave = 0.0f;
            if (t < half) wave = 1.0f - t / half;
            else if (t >= half + pause_s) wave = (t - half - pause_s) / half;
            const float level = (id(signal_pulse_peak).state / 100.0f) * wave;
            auto call = it.turn_on();
            call.set_brightness(level);
            call.set_state(true);
            call.set_transition_length(0);
            call.set_publish(false);
            call.set_save(false);
            call.perform();

text_sensor:
  - platform: mqtt_subscribe
    name: "P1 last command"
    id: p1
    topic: trains/track/turnout/P1
    on_value:
      - if:
          condition:
            and:
              - text_sensor.state:
                  id: p1
                  state: 'THROWN'
              - lambda: 'return !(id(p1_locked) || id(p1_field_locked));'
          then:
            - script.execute:
                id: p1_throw_thrown
                announce: true
      - if:
          condition:
            and:
              - text_sensor.state:
                  id: p1
                  state: 'CLOSED'
              - lambda: 'return !(id(p1_locked) || id(p1_field_locked));'
          then:
            - script.execute:
                id: p1_throw_closed
                announce: true
  - platform: mqtt_subscribe
    name: "P1 lock"
    id: p1_lock
    internal: true
    topic: trains/track/turnout/P1/Lock
    on_value:
      - if:
          condition:
            text_sensor.state:
              id: p1_lock
              state: 'LOCKED'
          then:
            - lambda: 'id(p1_locked) = true;'
            - logger.log:
                format: "P1 lock -> LOCKED"
                level: INFO
                tag: point_control
      - if:
          condition:
            text_sensor.state:
              id: p1_lock
              state: 'UNLOCKED'
          then:
            - lambda: 'id(p1_locked) = false;'
            - logger.log:
                format: "P1 lock -> UNLOCKED"
                level: INFO
                tag: point_control
  - platform: mqtt_subscribe
    name: "P2 last command"
    id: p2
    topic: trains/track/turnout/P2
    on_value:
      - if:
          condition:
            and:
              - text_sensor.state:
                  id: p2
                  state: 'THROWN'
              - lambda: 'return !(id(p2_field_locked) || id(p2_panel_locked));'
          then:
            - script.execute:
                id: p2_throw_thrown
                announce: true
      - if:
          condition:
            and:
              - text_sensor.state:
                  id: p2
                  state: 'CLOSED'
              - lambda: 'return !(id(p2_field_locked) || id(p2_panel_locked));'
          then:
            - script.execute:
                id: p2_throw_closed
                announce: true
  - platform: mqtt_subscribe
    name: "Left Bridge"
    id: left_bridge
    internal: true
    topic: "trains/track/signalmast/Left Bridge"
  - platform: mqtt_subscribe
    name: "Right Bridge"
    id: right_bridge
    internal: true
    topic: "trains/track/signalmast/Right Bridge"
  - platform: template
    id: board_name_check
    name: "Board name check"
  - platform: mqtt_subscribe
    id: board_owner
    internal: true
    topic: trains/track/board/gauntlet-k7m4x2/Owner
    on_value:
      - lambda: |-
          const std::string mine = get_mac_address_pretty();
          if (x == mine) {
            // Our own MAC came back. Anything older was a retained message.
            id(board_owner_heard) = true;
            id(board_name_check).publish_state("OK");
            return;
          }
          if (x.empty() || !id(board_owner_heard)) return;
          ESP_LOGE("board", "Another board called %s is on the broker (MAC %s). Give one of them a new suffix.", "gauntlet-k7m4x2", x.c_str());
          id(board_name_check).publish_state(std::string("Clash: another board called gauntlet-k7m4x2, MAC ") + x);
          id(mqtt_server).publish("trains/track/board/gauntlet-k7m4x2/Problem", std::string("Clash"), 0, false);
          // Send our MAC again, once, so the other board sees the clash too.
          if (!id(board_owner_answered)) {
            id(board_owner_answered) = true;
            id(mqtt_server).publish("trains/track/board/gauntlet-k7m4x2/Owner", mine, 2, true);
          }
  - platform: mqtt_subscribe
    id: linked_kiama_north_k7m4x2_online
    internal: true
    topic: trains/track/sensor/board/kiama-north-k7m4x2/Online
  - platform: mqtt_subscribe
    id: linked_kiama_north_k7m4x2_sensor_approach
    internal: true
    topic: trains/track/sensor/Approach/State
  - platform: mqtt_subscribe
    id: linked_kiama_north_k7m4x2_mast_home
    internal: true
    topic: trains/track/signalmast/Home/State
  - platform: template
    id: logic_version
    name: "Logic version"
    entity_category: diagnostic
    lambda: 'return {"ad7c88b5"};'
  - platform: template
    id: end_a_state
    name: "End A state"

text:
  - platform: template
    id: end_a_link
    name: "End A link"
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true

