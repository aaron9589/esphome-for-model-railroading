output:
  - platform: ledc
    id: p1_output
    pin: GPIO18
    frequency: 50Hz
  - platform: ledc
    id: p2_output
    pin: GPIO25
    frequency: 50Hz
  - platform: ledc
    id: left_bridge_lamp_0_output
    pin: GPIO32
    frequency: 1000Hz
  - platform: ledc
    id: left_bridge_lamp_1_output
    pin: GPIO19
    frequency: 1000Hz
  - platform: ledc
    id: right_bridge_lamp_0_output
    pin: GPIO21
    frequency: 1000Hz
  - platform: ledc
    id: right_bridge_lamp_1_output
    pin: GPIO22
    frequency: 1000Hz

servo:
