          then:
            - mqtt.publish:
                topic: trains/track/sensor/P2/Thrown
                payload: "INACTIVE"
                retain: true
                qos: 2
      - if:
          condition:
            lambda: 'return !id(p2_throw_thrown).is_running();'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/P2/Moving
                payload: INACTIVE
                retain: true
                qos: 2
  - id: p2_throw_thrown
