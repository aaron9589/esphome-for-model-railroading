name: Deploy Configurator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "configurator/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deploy only a configurator whose tests pass.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The site without its tests: the fixtures hold (fake) Wi-Fi passwords
      # and API keys that should not look like a published board.yaml.
      - name: Stage site
        run: rsync -a --exclude /test/ --exclude /package.json configurator/ "$RUNNER_TEMP/site/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
