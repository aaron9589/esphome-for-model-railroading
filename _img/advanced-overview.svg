<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="ovTitle ovDesc">
  <title id="ovTitle">Advanced samples around the layout computer</title>
  <desc id="ovDesc">End-of-block sensors, ground throws, bell codes, a staff machine, and WLED signals all meet Mosquitto. The Configurator board is a separate ESP for ordinary blocks and points.</desc>
  <rect width="880" height="460" fill="#f4f1ea"/>

  <rect x="16" y="16" width="520" height="428" rx="16" fill="#fffdf8" stroke="#e7e2d8"/>
  <text x="36" y="44" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">On the layout — these samples</text>

  <rect x="36" y="64" width="230" height="64" rx="10" fill="#e7f6ef" stroke="#0f6e56"/>
  <text x="151" y="90" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">End of block</text>
  <text x="151" y="110" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">GPIO detector, short ACTIVE</text>

  <rect x="286" y="64" width="230" height="64" rx="10" fill="#e8f1fb" stroke="#185fa5"/>
  <text x="401" y="90" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Ground throw</text>
  <text x="401" y="110" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">two switches, one lever</text>

  <rect x="36" y="148" width="230" height="64" rx="10" fill="#faeeda" stroke="#854f0b"/>
  <text x="151" y="174" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Bell codes</text>
  <text x="151" y="194" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">DFPlayer on UART</text>

  <rect x="286" y="148" width="230" height="64" rx="10" fill="#faeeda" stroke="#854f0b"/>
  <text x="401" y="174" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Staff machine</text>
  <text x="401" y="194" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">RC522 RFID + DFPlayer</text>

  <rect x="36" y="232" width="480" height="64" rx="10" fill="#e8f1fb" stroke="#185fa5"/>
  <text x="276" y="258" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Signal ESP</text>
  <text x="276" y="278" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">UART JSON to a second board running WLED</text>

  <rect x="36" y="320" width="480" height="100" rx="10" fill="#f5f5f4" stroke="#78716c"/>
  <text x="276" y="352" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">ESPHome packages</text>
  <text x="276" y="374" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">one file per job, included from your board</text>
  <text x="276" y="394" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">not the Configurator board</text>

  <rect x="556" y="16" width="308" height="428" rx="16" fill="#fffdf8" stroke="#e7e2d8"/>
  <text x="576" y="44" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Layout computer</text>

  <rect x="576" y="68" width="268" height="72" rx="12" fill="#faeeda" stroke="#854f0b" stroke-width="1.75"/>
  <text x="710" y="98" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Mosquitto</text>
  <text x="710" y="120" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">port 1883</text>

  <line x1="710" y1="140" x2="710" y2="176" stroke="#44403c" stroke-width="1.5"/>
  <text x="722" y="164" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">both ways</text>

  <rect x="576" y="184" width="268" height="72" rx="12" fill="#f4f4f5" stroke="#44403c"/>
  <text x="710" y="214" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">JMRI</text>
  <text x="710" y="236" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">sensors, turnouts, masts</text>

  <line x1="710" y1="256" x2="710" y2="292" stroke="#44403c" stroke-width="1.5"/>
  <polygon points="710,256 705.5,265 715.5,265" fill="#44403c"/>
  <text x="722" y="280" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">writes tables</text>

  <rect x="576" y="300" width="268" height="72" rx="12" fill="#f4f4f5" stroke="#44403c"/>
  <text x="710" y="330" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">CATS</text>
  <text x="710" y="352" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">panel buttons and describers</text>

  <line x1="516" y1="264" x2="546" y2="264" stroke="#44403c" stroke-width="1.5"/>
  <line x1="546" y1="264" x2="546" y2="104" stroke="#44403c" stroke-width="1.5"/>
  <line x1="546" y1="104" x2="576" y2="104" stroke="#44403c" stroke-width="1.5"/>
  <polygon points="576,104 567,99.5 567,108.5" fill="#44403c"/>
  <text x="528" y="252" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Wi-Fi</text>
</svg>
