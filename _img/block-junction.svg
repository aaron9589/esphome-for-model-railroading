<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
  <title id="title">A junction with three blocks and an optic in the centre of the turnout</title>
  <desc id="desc">When the branch is lined, turnout lined is REVERSE and the main is held occupied. When the main is lined, turnout lined is NORMAL and the branch is held occupied. The optic in the centre occupies the throat block.</desc>
  <rect width="960" height="590" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="34" font-size="18" font-weight="600">A junction</text>
    <text x="32" y="56" fill="#57534e" font-size="13">Three blocks: throat, main, and diverging. The optic in the centre sees a train on either leg.</text>
    <rect x="16" y="76" width="928" height="240" rx="16" fill="#faeeda"/>
    <text x="36" y="104" fill="#854f0b" font-size="15" font-weight="600">Branch is lined, and that block is clear</text>
    <g transform="translate(70 154) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="70" y="188" text-anchor="middle" fill="#57534e" font-size="11">throat</text>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="100" y1="148" x2="250" y2="148"/>
      <line x1="100" y1="160" x2="250" y2="160"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2"><line x1="112" y1="148" x2="112" y2="160"/><line x1="130" y1="148" x2="130" y2="160"/><line x1="148" y1="148" x2="148" y2="160"/><line x1="166" y1="148" x2="166" y2="160"/><line x1="184" y1="148" x2="184" y2="160"/><line x1="202" y1="148" x2="202" y2="160"/><line x1="220" y1="148" x2="220" y2="160"/><line x1="238" y1="148" x2="238" y2="160"/></g>
    <g stroke="#854f0b" stroke-width="3" stroke-linecap="butt">
      <line x1="268" y1="148" x2="460" y2="148"/>
      <line x1="268" y1="160" x2="460" y2="160"/>
    </g>
    <g stroke="#854f0b" stroke-width="2"><line x1="280" y1="148" x2="280" y2="160"/><line x1="298" y1="148" x2="298" y2="160"/><line x1="316" y1="148" x2="316" y2="160"/><line x1="334" y1="148" x2="334" y2="160"/><line x1="352" y1="148" x2="352" y2="160"/><line x1="370" y1="148" x2="370" y2="160"/><line x1="388" y1="148" x2="388" y2="160"/><line x1="406" y1="148" x2="406" y2="160"/><line x1="424" y1="148" x2="424" y2="160"/><line x1="442" y1="148" x2="442" y2="160"/></g>
    <path d="M400 160 L490 226" fill="none" stroke="#0f6e56" stroke-width="3" stroke-linecap="round"/>
    <path d="M388 160 L478 226" fill="none" stroke="#0f6e56" stroke-width="3" stroke-linecap="round"/>
    <circle cx="400" cy="172" r="6" fill="#0f6e56"/>
    <text x="414" y="194" fill="#0f6e56" font-size="11" font-weight="600">turnout optic</text>
    <g transform="translate(500 154) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="500" y="140" text-anchor="middle" fill="#57534e" font-size="11">main</text>
    <g transform="translate(520 244) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="548" y="248" fill="#57534e" font-size="11">branch</text>
    <text x="560" y="140" fill="#44403c" font-size="13">block on the main</text>
    <rect x="800" y="124" width="112" height="24" rx="6" fill="#fde8e8"/>
    <text x="856" y="140" text-anchor="middle" fill="#9f1239" font-size="12" font-weight="600">OCCUPIED</text>
    <text x="560" y="172" fill="#44403c" font-size="13">block on the branch</text>
    <rect x="800" y="156" width="112" height="24" rx="6" fill="#e7f6ef"/>
    <text x="856" y="172" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">CLEAR</text>
    <text x="560" y="204" fill="#44403c" font-size="13">turnout lined</text>
    <rect x="800" y="188" width="112" height="24" rx="6" fill="#faeeda"/>
    <text x="856" y="204" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">REVERSE</text>
    <text x="36" y="290" fill="#44403c" font-size="13">The throat signal shows Approach Diverging. With no such aspect, it shows Approach.</text>
    <rect x="16" y="330" width="928" height="240" rx="16" fill="#e8f1fb"/>
    <text x="36" y="358" fill="#185fa5" font-size="15" font-weight="600">Main is lined</text>
    <g transform="translate(70 408) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="70" y="442" text-anchor="middle" fill="#57534e" font-size="11">throat</text>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="100" y1="402" x2="250" y2="402"/>
      <line x1="100" y1="414" x2="250" y2="414"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2"><line x1="112" y1="402" x2="112" y2="414"/><line x1="130" y1="402" x2="130" y2="414"/><line x1="148" y1="402" x2="148" y2="414"/><line x1="166" y1="402" x2="166" y2="414"/><line x1="184" y1="402" x2="184" y2="414"/><line x1="202" y1="402" x2="202" y2="414"/><line x1="220" y1="402" x2="220" y2="414"/><line x1="238" y1="402" x2="238" y2="414"/></g>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="268" y1="402" x2="460" y2="402"/>
      <line x1="268" y1="414" x2="460" y2="414"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2"><line x1="280" y1="402" x2="280" y2="414"/><line x1="298" y1="402" x2="298" y2="414"/><line x1="316" y1="402" x2="316" y2="414"/><line x1="334" y1="402" x2="334" y2="414"/><line x1="352" y1="402" x2="352" y2="414"/><line x1="370" y1="402" x2="370" y2="414"/><line x1="388" y1="402" x2="388" y2="414"/><line x1="406" y1="402" x2="406" y2="414"/><line x1="424" y1="402" x2="424" y2="414"/><line x1="442" y1="402" x2="442" y2="414"/></g>
    <path d="M400 414 L490 480" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M388 414 L478 480" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="400" cy="426" r="6" fill="#0f6e56"/>
    <text x="414" y="448" fill="#0f6e56" font-size="11" font-weight="600">turnout optic</text>
    <g transform="translate(500 408) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="500" y="394" text-anchor="middle" fill="#57534e" font-size="11">main</text>
    <g transform="translate(520 498) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="548" y="502" fill="#57534e" font-size="11">branch</text>
    <text x="560" y="394" fill="#44403c" font-size="13">block on the main</text>
    <rect x="800" y="378" width="112" height="24" rx="6" fill="#e7f6ef"/>
    <text x="856" y="394" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">CLEAR</text>
    <text x="560" y="426" fill="#44403c" font-size="13">block on the branch</text>
    <rect x="800" y="410" width="112" height="24" rx="6" fill="#fde8e8"/>
    <text x="856" y="426" text-anchor="middle" fill="#9f1239" font-size="12" font-weight="600">OCCUPIED</text>
    <text x="560" y="458" fill="#44403c" font-size="13">turnout lined</text>
    <rect x="800" y="442" width="112" height="24" rx="6" fill="#e7f6ef"/>
    <text x="856" y="458" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">NORMAL</text>
    <text x="36" y="544" fill="#44403c" font-size="13">The branch signal stays at Stop. The throat signal follows the main.</text>
  </g>
</svg>
