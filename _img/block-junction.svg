<svg xmlns="http://www.w3.org/2000/svg" width="960" height="612" viewBox="0 0 960 612" role="img" aria-labelledby="title desc">
  <title id="title">A signal block where the track splits</title>
  <desc id="desc">When the branch is lined and clear, the main block topic is held occupied and the diverging topic is ACTIVE. When the main is lined, the branch block is held occupied and diverging is INACTIVE.</desc>
  <rect width="960" height="612" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="34" font-size="18" font-weight="600">Where the track splits</text>
    <text x="32" y="56" fill="#57534e" font-size="13">The block that holds the points. The route that is not lined is held occupied. Diverging is a separate topic.</text>
    <rect x="16" y="76" width="928" height="250" rx="16" fill="#faeeda"/>
    <text x="36" y="108" fill="#854f0b" font-size="15" font-weight="600">Branch is lined, and that block is clear</text>
    <g transform="translate(78 154) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="78" y="188" text-anchor="middle" fill="#57534e" font-size="11">one block back</text>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="108" y1="148" x2="250" y2="148"/>
      <line x1="108" y1="160" x2="250" y2="160"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2"><line x1="120" y1="148" x2="120" y2="160"/><line x1="138" y1="148" x2="138" y2="160"/><line x1="156" y1="148" x2="156" y2="160"/><line x1="174" y1="148" x2="174" y2="160"/><line x1="192" y1="148" x2="192" y2="160"/><line x1="210" y1="148" x2="210" y2="160"/><line x1="228" y1="148" x2="228" y2="160"/></g>
    <text x="180" y="140" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">protects · from its topic</text>
    <g stroke="#854f0b" stroke-width="3" stroke-linecap="butt">
      <line x1="268" y1="148" x2="470" y2="148"/>
      <line x1="268" y1="160" x2="470" y2="160"/>
    </g>
    <g stroke="#854f0b" stroke-width="2"><line x1="280" y1="148" x2="280" y2="160"/><line x1="298" y1="148" x2="298" y2="160"/><line x1="316" y1="148" x2="316" y2="160"/><line x1="334" y1="148" x2="334" y2="160"/><line x1="352" y1="148" x2="352" y2="160"/><line x1="370" y1="148" x2="370" y2="160"/><line x1="388" y1="148" x2="388" y2="160"/><line x1="406" y1="148" x2="406" y2="160"/><line x1="424" y1="148" x2="424" y2="160"/><line x1="442" y1="148" x2="442" y2="160"/><line x1="460" y1="148" x2="460" y2="160"/></g>
    <path d="M430 160 L500 226" fill="none" stroke="#0f6e56" stroke-width="3" stroke-linecap="round"/>
    <path d="M418 160 L488 226" fill="none" stroke="#0f6e56" stroke-width="3" stroke-linecap="round"/>
    <text x="360" y="140" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">main · held occupied</text>
    <text x="548" y="262" fill="#0f6e56" font-size="12" font-weight="600">branch · clear</text>
    <text x="560" y="154" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">block/…/main</text>
    <rect x="820" y="138" width="100" height="24" rx="6" fill="#fde8e8"/>
    <text x="870" y="154" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">OCCUPIED</text>
    <text x="560" y="186" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">block/…/branch</text>
    <rect x="820" y="170" width="100" height="24" rx="6" fill="#e7f6ef"/>
    <text x="870" y="186" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">CLEAR</text>
    <text x="560" y="218" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">diverging/…/name</text>
    <rect x="820" y="202" width="100" height="24" rx="6" fill="#faeeda"/>
    <text x="870" y="218" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">ACTIVE</text>
    <text x="36" y="282" fill="#44403c" font-size="13">The signal one block back shows Approach Diverging, when it has that aspect.</text>
    <text x="36" y="304" fill="#44403c" font-size="13">Without that aspect it still sees main occupied, so it shows Approach.</text>
    <rect x="16" y="342" width="928" height="250" rx="16" fill="#e8f1fb"/>
    <text x="36" y="374" fill="#185fa5" font-size="15" font-weight="600">Main is lined</text>
    <g transform="translate(78 420) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="78" y="454" text-anchor="middle" fill="#57534e" font-size="11">one block back</text>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="108" y1="414" x2="250" y2="414"/>
      <line x1="108" y1="426" x2="250" y2="426"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2"><line x1="120" y1="414" x2="120" y2="426"/><line x1="138" y1="414" x2="138" y2="426"/><line x1="156" y1="414" x2="156" y2="426"/><line x1="174" y1="414" x2="174" y2="426"/><line x1="192" y1="414" x2="192" y2="426"/><line x1="210" y1="414" x2="210" y2="426"/><line x1="228" y1="414" x2="228" y2="426"/></g>
    <text x="180" y="406" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">protects · from its topic</text>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="268" y1="414" x2="470" y2="414"/>
      <line x1="268" y1="426" x2="470" y2="426"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2"><line x1="280" y1="414" x2="280" y2="426"/><line x1="298" y1="414" x2="298" y2="426"/><line x1="316" y1="414" x2="316" y2="426"/><line x1="334" y1="414" x2="334" y2="426"/><line x1="352" y1="414" x2="352" y2="426"/><line x1="370" y1="414" x2="370" y2="426"/><line x1="388" y1="414" x2="388" y2="426"/><line x1="406" y1="414" x2="406" y2="426"/><line x1="424" y1="414" x2="424" y2="426"/><line x1="442" y1="414" x2="442" y2="426"/><line x1="460" y1="414" x2="460" y2="426"/></g>
    <path d="M430 426 L500 492" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M418 426 L488 492" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <text x="360" y="406" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">main · from its detectors</text>
    <text x="548" y="528" fill="#854f0b" font-size="12" font-weight="600">branch · held occupied</text>
    <text x="560" y="420" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">block/…/main</text>
    <rect x="820" y="404" width="100" height="24" rx="6" fill="#e7f6ef"/>
    <text x="870" y="420" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">CLEAR</text>
    <text x="560" y="452" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">block/…/branch</text>
    <rect x="820" y="436" width="100" height="24" rx="6" fill="#fde8e8"/>
    <text x="870" y="452" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">OCCUPIED</text>
    <text x="560" y="484" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">diverging/…/name</text>
    <rect x="820" y="468" width="100" height="24" rx="6" fill="#e7f6ef"/>
    <text x="870" y="484" text-anchor="middle" fill="#185fa5" font-size="12" font-weight="600">INACTIVE</text>
    <text x="36" y="548" fill="#44403c" font-size="13">The signal one block back follows the main block.</text>
    <text x="36" y="570" fill="#44403c" font-size="13">The branch is held occupied, so nothing shows Clear into the misaligned route.</text>
  </g>
</svg>
