    <g transform="translate(250 196) scale(-1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <rect x="172" y="184" width="64" height="24" rx="8" fill="#e7f6ef" stroke="#0f6e56"/><text x="204.0" y="200" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">Clear</text>
    <g transform="translate(590 124) scale(1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <rect x="606" y="112" width="64" height="24" rx="8" fill="#fde8e8" stroke="#b42318"/><text x="638.0" y="128" text-anchor="middle" fill="#b42318" font-size="12" font-weight="600">Stop</text>
    <g transform="translate(590 196) scale(-1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <rect x="512" y="184" width="64" height="24" rx="8" fill="#fde8e8" stroke="#b42318"/><text x="544.0" y="200" text-anchor="middle" fill="#b42318" font-size="12" font-weight="600">Stop</text>
    <rect x="668" y="146" width="72" height="32" rx="6" fill="#292524"/>
    <text x="704" y="167" text-anchor="middle" fill="#f4f1ea" font-size="12" font-weight="600">train</text>
    <rect x="32" y="228" width="896" height="286" rx="12" fill="#fffdf8" stroke="#e7e2d8"/>
    <text x="48" y="256" font-size="13" font-weight="600">Sent</text>
    <text x="48" y="280" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">boundaryOptic/east-board                1 OCCUPIED</text>
    <text x="48" y="304" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead/east-board/right                  1 OCCUPIED CLEAR CLEAR INACTIVE</text>
    <text x="48" y="328" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead/gap-board/one                     1 OCCUPIED OCCUPIED CLEAR INACTIVE</text>
    <text x="48" y="352" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead/gap-board/two                     1 OCCUPIED CLEAR CLEAR INACTIVE</text>
    <text x="48" y="376" font-size="13" font-weight="600">Acted on</text>
    <text x="48" y="400" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">east facing next reads its right BLOCK  Stop</text>
    <text x="48" y="424" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">west facing east reads one, BLOCK       Stop</text>
    <text x="48" y="448" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">east facing west reads two, BLOCK       Stop</text>
    <text x="48" y="480" fill="#57534e" font-size="13">Stop wins, so the OCCUPIED next word on the westward postcard does not show Approach.</text>
  </g></svg>
