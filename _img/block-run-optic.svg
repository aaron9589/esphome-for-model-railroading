<svg xmlns="http://www.w3.org/2000/svg" width="960" height="538" viewBox="0 0 960 538" role="img" aria-labelledby="title desc">
  <title id="title">3. A train is on the boundary optic</title>
  <desc id="desc">boundaryOptic/east-board is 1 OCCUPIED. It sets BLOCK for this block and for the next. The signals that protect either block show Stop.</desc>
  <rect width="960" height="538" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">3. A train is on the boundary optic</text>
    <text x="32" y="58" fill="#57534e" font-size="13">East's optic publishes OCCUPIED. It occupies this block and the next, so the signals that protect either block show Stop.</text>
    <text x="160" y="88" text-anchor="middle" fill="#185fa5" font-size="12" font-weight="600">west boundary</text>
    <text x="470" y="88" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">interim · this block</text>
    <text x="700" y="88" text-anchor="middle" fill="#185fa5" font-size="12" font-weight="600">east boundary</text>
    <g stroke="#a8a29e" stroke-width="3" stroke-linecap="butt"><line x1="48" y1="156" x2="250" y2="156"/><line x1="48" y1="168" x2="250" y2="168"/></g><g stroke="#a8a29e" stroke-width="2"><line x1="60" y1="156" x2="60" y2="168"/><line x1="78" y1="156" x2="78" y2="168"/><line x1="96" y1="156" x2="96" y2="168"/><line x1="114" y1="156" x2="114" y2="168"/><line x1="132" y1="156" x2="132" y2="168"/><line x1="150" y1="156" x2="150" y2="168"/><line x1="168" y1="156" x2="168" y2="168"/><line x1="186" y1="156" x2="186" y2="168"/><line x1="204" y1="156" x2="204" y2="168"/><line x1="222" y1="156" x2="222" y2="168"/><line x1="240" y1="156" x2="240" y2="168"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt"><line x1="280" y1="156" x2="560" y2="156"/><line x1="280" y1="168" x2="560" y2="168"/></g><g stroke="#d32f2f" stroke-width="2"><line x1="292" y1="156" x2="292" y2="168"/><line x1="310" y1="156" x2="310" y2="168"/><line x1="328" y1="156" x2="328" y2="168"/><line x1="346" y1="156" x2="346" y2="168"/><line x1="364" y1="156" x2="364" y2="168"/><line x1="382" y1="156" x2="382" y2="168"/><line x1="400" y1="156" x2="400" y2="168"/><line x1="418" y1="156" x2="418" y2="168"/><line x1="436" y1="156" x2="436" y2="168"/><line x1="454" y1="156" x2="454" y2="168"/><line x1="472" y1="156" x2="472" y2="168"/><line x1="490" y1="156" x2="490" y2="168"/><line x1="508" y1="156" x2="508" y2="168"/><line x1="526" y1="156" x2="526" y2="168"/><line x1="544" y1="156" x2="544" y2="168"/></g>
    <g stroke="#854f0b" stroke-width="3" stroke-linecap="butt"><line x1="590" y1="156" x2="912" y2="156"/><line x1="590" y1="168" x2="912" y2="168"/></g><g stroke="#854f0b" stroke-width="2"><line x1="602" y1="156" x2="602" y2="168"/><line x1="620" y1="156" x2="620" y2="168"/><line x1="638" y1="156" x2="638" y2="168"/><line x1="656" y1="156" x2="656" y2="168"/><line x1="674" y1="156" x2="674" y2="168"/><line x1="692" y1="156" x2="692" y2="168"/><line x1="710" y1="156" x2="710" y2="168"/><line x1="728" y1="156" x2="728" y2="168"/><line x1="746" y1="156" x2="746" y2="168"/><line x1="764" y1="156" x2="764" y2="168"/><line x1="782" y1="156" x2="782" y2="168"/><line x1="800" y1="156" x2="800" y2="168"/><line x1="818" y1="156" x2="818" y2="168"/><line x1="836" y1="156" x2="836" y2="168"/><line x1="854" y1="156" x2="854" y2="168"/><line x1="872" y1="156" x2="872" y2="168"/><line x1="890" y1="156" x2="890" y2="168"/></g>
    <g transform="translate(250 124) scale(1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
