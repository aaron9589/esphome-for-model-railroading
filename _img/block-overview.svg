<svg xmlns="http://www.w3.org/2000/svg" width="960" height="496" viewBox="0 0 960 496" role="img" aria-labelledby="title desc">
  <title id="title">Boundary, interim, and junction boards</title>
  <desc id="desc">A boundary has signals facing both ways, an optic at the signals, and one current detector. An interim is a current detector inside a block. A junction is a turnout with a signal on each leg facing in, and one optic under the frog. A block runs from one boundary or junction to the next.</desc>
  <rect width="960" height="496" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">Three boards</text>
    <text x="32" y="58" fill="#57534e" font-size="13">A block runs from one starred board to the next. An interim only adds its detector.</text>
    <rect x="32" y="80" width="288" height="168" rx="12" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="176" y="112" text-anchor="middle" font-size="16" font-weight="600">Boundary *</text>
    <text x="52" y="142" fill="#44403c" font-size="13">Signals face both ways.</text>
    <text x="52" y="164" fill="#44403c" font-size="13">Optic at the signals.</text>
    <text x="52" y="186" fill="#44403c" font-size="13">One current detector,</text>
    <text x="52" y="208" fill="#44403c" font-size="13">on the left or the right.</text>
    <rect x="336" y="80" width="288" height="168" rx="12" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="480" y="112" text-anchor="middle" font-size="16" font-weight="600">Interim</text>
    <text x="356" y="142" fill="#44403c" font-size="13">Current detector only.</text>
    <text x="356" y="164" fill="#44403c" font-size="13">No signals and no optic.</text>
    <text x="356" y="186" fill="#44403c" font-size="13">Sits inside a block.</text>
    <text x="356" y="208" fill="#44403c" font-size="13">Cannot end a block.</text>
    <rect x="640" y="80" width="288" height="168" rx="12" fill="#faeeda" stroke="#854f0b"/>
    <text x="784" y="112" text-anchor="middle" font-size="16" font-weight="600">Junction *</text>
    <text x="660" y="142" fill="#44403c" font-size="13">A turnout.</text>
    <text x="660" y="164" fill="#44403c" font-size="13">A signal on each leg,</text>
    <text x="660" y="186" fill="#44403c" font-size="13">facing the turnout.</text>
    <text x="660" y="208" fill="#44403c" font-size="13">Optic under the frog.</text>
    <text x="480" y="286" text-anchor="middle" fill="#44403c" font-size="12" font-weight="600" letter-spacing="0.06em">ONE BLOCK</text>
    <line x1="160" y1="298" x2="620" y2="298" stroke="#44403c" stroke-width="1.5"/>
    <line x1="160" y1="290" x2="160" y2="306" stroke="#44403c" stroke-width="1.5"/>
    <line x1="620" y1="290" x2="620" y2="306" stroke="#44403c" stroke-width="1.5"/>
    <g stroke="#a8a29e" stroke-width="3" stroke-linecap="butt">
      <line x1="48" y1="330" x2="140" y2="330"/>
      <line x1="48" y1="342" x2="140" y2="342"/>
    </g>
    <g stroke="#a8a29e" stroke-width="2"><line x1="60" y1="330" x2="60" y2="342"/><line x1="78" y1="330" x2="78" y2="342"/><line x1="96" y1="330" x2="96" y2="342"/><line x1="114" y1="330" x2="114" y2="342"/><line x1="132" y1="330" x2="132" y2="342"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
      <line x1="180" y1="330" x2="600" y2="330"/>
      <line x1="180" y1="342" x2="600" y2="342"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="192" y1="330" x2="192" y2="342"/><line x1="210" y1="330" x2="210" y2="342"/><line x1="228" y1="330" x2="228" y2="342"/><line x1="246" y1="330" x2="246" y2="342"/><line x1="264" y1="330" x2="264" y2="342"/><line x1="282" y1="330" x2="282" y2="342"/><line x1="300" y1="330" x2="300" y2="342"/><line x1="318" y1="330" x2="318" y2="342"/><line x1="336" y1="330" x2="336" y2="342"/><line x1="354" y1="330" x2="354" y2="342"/><line x1="372" y1="330" x2="372" y2="342"/><line x1="390" y1="330" x2="390" y2="342"/><line x1="408" y1="330" x2="408" y2="342"/><line x1="426" y1="330" x2="426" y2="342"/><line x1="444" y1="330" x2="444" y2="342"/><line x1="462" y1="330" x2="462" y2="342"/><line x1="480" y1="330" x2="480" y2="342"/><line x1="498" y1="330" x2="498" y2="342"/><line x1="516" y1="330" x2="516" y2="342"/><line x1="534" y1="330" x2="534" y2="342"/><line x1="552" y1="330" x2="552" y2="342"/><line x1="570" y1="330" x2="570" y2="342"/><line x1="588" y1="330" x2="588" y2="342"/></g>
    <g stroke="#a8a29e" stroke-width="3" stroke-linecap="butt">
      <line x1="660" y1="330" x2="912" y2="330"/>
      <line x1="660" y1="342" x2="912" y2="342"/>
    </g>
    <g stroke="#a8a29e" stroke-width="2"><line x1="672" y1="330" x2="672" y2="342"/><line x1="690" y1="330" x2="690" y2="342"/><line x1="708" y1="330" x2="708" y2="342"/><line x1="726" y1="330" x2="726" y2="342"/><line x1="744" y1="330" x2="744" y2="342"/><line x1="762" y1="330" x2="762" y2="342"/><line x1="780" y1="330" x2="780" y2="342"/><line x1="798" y1="330" x2="798" y2="342"/><line x1="816" y1="330" x2="816" y2="342"/><line x1="834" y1="330" x2="834" y2="342"/><line x1="852" y1="330" x2="852" y2="342"/><line x1="870" y1="330" x2="870" y2="342"/><line x1="888" y1="330" x2="888" y2="342"/></g>
    <g transform="translate(160 336) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <g transform="translate(160 372) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <g transform="translate(620 336) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <g transform="translate(620 372) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="160" y="408" text-anchor="middle" fill="#185fa5" font-size="12" font-weight="600">west boundary</text>
    <text x="480" y="368" text-anchor="middle" fill="#0f6e56" font-size="13" font-weight="600">interim</text>
    <text x="620" y="408" text-anchor="middle" fill="#185fa5" font-size="12" font-weight="600">east boundary</text>
    <text x="786" y="368" text-anchor="middle" fill="#78716c" font-size="12">next block</text>
    <text x="32" y="448" fill="#57534e" font-size="13">The interim detector belongs to the block between west and east. It does not make a block of its own.</text>
    <text x="32" y="470" fill="#57534e" font-size="13">The optic at each boundary occupies this block and the block on the other side of the signals.</text>
  </g>
</svg>
