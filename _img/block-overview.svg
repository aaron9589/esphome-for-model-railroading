<svg xmlns="http://www.w3.org/2000/svg" width="960" height="668" viewBox="0 0 960 668" role="img" aria-labelledby="title desc">
  <title id="title">Block signalling with the same modules as the Modular Signal System</title>
  <desc id="desc">Three boards on one track. South and north carry the signals. Mid only detects. Each board publishes a block topic. Amber chips are the postcard a neighbour reads when the modules were paired at the layout.</desc>
  <rect width="960" height="668" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">Block signalling, with the same modules as MSS</text>
    <text x="32" y="58" fill="#57534e" font-size="13">Each board publishes the occupancy it measured. A signal reads those topics and runs one script.</text>
    <rect x="620" y="24" width="12" height="12" rx="2" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="638" y="35" fill="#44403c" font-size="12">Board</text>
    <rect x="700" y="24" width="12" height="12" rx="2" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="718" y="35" fill="#44403c" font-size="12">Publishes a fact</text>
    <rect x="830" y="24" width="12" height="12" rx="2" fill="#faeeda" stroke="#854f0b"/>
    <text x="848" y="35" fill="#44403c" font-size="12">Postcard</text>
    <text x="480" y="96" text-anchor="middle" fill="#44403c" font-size="12" font-weight="600" letter-spacing="0.08em">ONE SIGNALLED TRACK · MAIN</text>
    <g fill="#57534e" font-size="12" font-weight="600" text-anchor="middle">
      <text x="164" y="122">south</text>
      <text x="480" y="122">mid</text>
      <text x="796" y="122">north</text>
    </g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
      <line x1="48" y1="148" x2="300" y2="148"/>
      <line x1="48" y1="160" x2="300" y2="160"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="60" y1="148" x2="60" y2="160"/><line x1="78" y1="148" x2="78" y2="160"/><line x1="96" y1="148" x2="96" y2="160"/><line x1="114" y1="148" x2="114" y2="160"/><line x1="132" y1="148" x2="132" y2="160"/><line x1="150" y1="148" x2="150" y2="160"/><line x1="168" y1="148" x2="168" y2="160"/><line x1="186" y1="148" x2="186" y2="160"/><line x1="204" y1="148" x2="204" y2="160"/><line x1="222" y1="148" x2="222" y2="160"/><line x1="240" y1="148" x2="240" y2="160"/><line x1="258" y1="148" x2="258" y2="160"/><line x1="276" y1="148" x2="276" y2="160"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
      <line x1="332" y1="148" x2="628" y2="148"/>
      <line x1="332" y1="160" x2="628" y2="160"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="344" y1="148" x2="344" y2="160"/><line x1="362" y1="148" x2="362" y2="160"/><line x1="380" y1="148" x2="380" y2="160"/><line x1="398" y1="148" x2="398" y2="160"/><line x1="416" y1="148" x2="416" y2="160"/><line x1="434" y1="148" x2="434" y2="160"/><line x1="452" y1="148" x2="452" y2="160"/><line x1="470" y1="148" x2="470" y2="160"/><line x1="488" y1="148" x2="488" y2="160"/><line x1="506" y1="148" x2="506" y2="160"/><line x1="524" y1="148" x2="524" y2="160"/><line x1="542" y1="148" x2="542" y2="160"/><line x1="560" y1="148" x2="560" y2="160"/><line x1="578" y1="148" x2="578" y2="160"/><line x1="596" y1="148" x2="596" y2="160"/><line x1="614" y1="148" x2="614" y2="160"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
      <line x1="660" y1="148" x2="912" y2="148"/>
      <line x1="660" y1="160" x2="912" y2="160"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="672" y1="148" x2="672" y2="160"/><line x1="690" y1="148" x2="690" y2="160"/><line x1="708" y1="148" x2="708" y2="160"/><line x1="726" y1="148" x2="726" y2="160"/><line x1="744" y1="148" x2="744" y2="160"/><line x1="762" y1="148" x2="762" y2="160"/><line x1="780" y1="148" x2="780" y2="160"/><line x1="798" y1="148" x2="798" y2="160"/><line x1="816" y1="148" x2="816" y2="160"/><line x1="834" y1="148" x2="834" y2="160"/><line x1="852" y1="148" x2="852" y2="160"/><line x1="870" y1="148" x2="870" y2="160"/><line x1="888" y1="148" x2="888" y2="160"/></g>
    <text x="250" y="140" text-anchor="end" fill="#44403c" font-size="12">protects mid</text>
    <text x="228" y="196" text-anchor="end" fill="#44403c" font-size="12">protects south</text>
    <text x="720" y="140" fill="#44403c" font-size="12">protects north</text>
    <text x="700" y="196" fill="#44403c" font-size="12">protects mid</text>
    <g transform="translate(300 156) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <g transform="translate(300 208) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <g transform="translate(660 156) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <g transform="translate(660 208) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <rect x="32" y="236" width="896" height="40" rx="10" fill="#faeeda" stroke="#854f0b"/>
    <text x="480" y="261" text-anchor="middle" font-size="14" font-weight="600">Mosquitto</text>
    <text x="560" y="261" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">mss/main/#</text>
    <rect x="32" y="296" width="288" height="292" rx="12" fill="#ebe6dc" stroke="#cfc8bc"/>
    <text x="176" y="326" text-anchor="middle" font-size="15" font-weight="600">south · cascade</text>
    <text x="48" y="354" fill="#57534e" font-size="13">Publishes the south block, the optical</text>
    <text x="48" y="372" fill="#57534e" font-size="13">at this joint, and one postcard.</text>
    <text x="48" y="390" fill="#57534e" font-size="13">Facing south reads the south block.</text>
    <text x="48" y="408" fill="#57534e" font-size="13">Facing north reads mid’s postcard.</text>
    <rect x="48" y="436" width="256" height="36" rx="8" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="176" y="459" text-anchor="middle" fill="#0f6e56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">block / south</text>
    <rect x="48" y="480" width="256" height="36" rx="8" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="176" y="503" text-anchor="middle" fill="#0f6e56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">joint / south / end</text>
    <rect x="48" y="524" width="256" height="36" rx="8" fill="#faeeda" stroke="#854f0b"/>
    <text x="176" y="547" text-anchor="middle" fill="#854f0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead / south / end</text>
    <rect x="336" y="296" width="288" height="292" rx="12" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="480" y="326" text-anchor="middle" font-size="15" font-weight="600">mid · crossover</text>
    <text x="352" y="354" fill="#57534e" font-size="13">Publishes the mid block. No signal.</text>
    <text x="352" y="372" fill="#57534e" font-size="13">Two postcards, one out of each end.</text>
    <text x="352" y="390" fill="#57534e" font-size="13">Each postcard carries mid, then the</text>
    <text x="352" y="408" fill="#57534e" font-size="13">block beyond the other end.</text>
    <rect x="352" y="436" width="256" height="36" rx="8" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="480" y="459" text-anchor="middle" fill="#0f6e56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">block / mid</text>
    <rect x="352" y="480" width="256" height="36" rx="8" fill="#faeeda" stroke="#854f0b"/>
    <text x="480" y="503" text-anchor="middle" fill="#854f0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead / mid / begin</text>
    <rect x="352" y="524" width="256" height="36" rx="8" fill="#faeeda" stroke="#854f0b"/>
    <text x="480" y="547" text-anchor="middle" fill="#854f0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead / mid / end</text>
    <rect x="640" y="296" width="288" height="292" rx="12" fill="#ebe6dc" stroke="#cfc8bc"/>
    <text x="784" y="326" text-anchor="middle" font-size="15" font-weight="600">north · cascade</text>
    <text x="656" y="354" fill="#57534e" font-size="13">Publishes the north block, the optical</text>
    <text x="656" y="372" fill="#57534e" font-size="13">at this joint, and one postcard.</text>
    <text x="656" y="390" fill="#57534e" font-size="13">Facing north reads the north block.</text>
    <text x="656" y="408" fill="#57534e" font-size="13">Facing south reads mid’s postcard.</text>
    <rect x="656" y="436" width="256" height="36" rx="8" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="784" y="459" text-anchor="middle" fill="#0f6e56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">block / north</text>
    <rect x="656" y="480" width="256" height="36" rx="8" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="784" y="503" text-anchor="middle" fill="#0f6e56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">joint / north / begin</text>
    <rect x="656" y="524" width="256" height="36" rx="8" fill="#faeeda" stroke="#854f0b"/>
    <text x="784" y="547" text-anchor="middle" fill="#854f0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead / north / begin</text>
    <text x="32" y="620" fill="#57534e" font-size="13">Names written in the configurator skip the postcard. The signal subscribes to the block topics themselves.</text>
    <text x="32" y="642" fill="#57534e" font-size="13">A current detector still publishes trains/track/sensor/… for JMRI. The signal script does not read that topic.</text>
  </g>
</svg>
