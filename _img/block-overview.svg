<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
  <title id="title">The three board pieces</title>
  <desc id="desc">A boundary has the optic and the signals in the centre, with a block on the left and a block on the right. An interim is one block detector. A junction has a throat block covering the approach and the turnout, an optic in the centre, then a main block and a diverging block.</desc>
  <rect width="960" height="820" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">Three boards</text>
    <text x="32" y="58" fill="#57534e" font-size="13">A block runs from one starred board to the next. An interim only adds its detector.</text>
    <rect x="16" y="76" width="928" height="210" rx="16" fill="#e8f1fb"/>
    <text x="36" y="108" fill="#185fa5" font-size="16" font-weight="600">Boundary *</text>
    <g stroke="#185fa5" stroke-width="3" stroke-linecap="butt"><line x1="70" y1="148" x2="330" y2="148"/><line x1="70" y1="160" x2="330" y2="160"/></g><g stroke="#185fa5" stroke-width="2"><line x1="82" y1="148" x2="82" y2="160"/><line x1="100" y1="148" x2="100" y2="160"/><line x1="118" y1="148" x2="118" y2="160"/><line x1="136" y1="148" x2="136" y2="160"/><line x1="154" y1="148" x2="154" y2="160"/><line x1="172" y1="148" x2="172" y2="160"/><line x1="190" y1="148" x2="190" y2="160"/><line x1="208" y1="148" x2="208" y2="160"/><line x1="226" y1="148" x2="226" y2="160"/><line x1="244" y1="148" x2="244" y2="160"/><line x1="262" y1="148" x2="262" y2="160"/><line x1="280" y1="148" x2="280" y2="160"/><line x1="298" y1="148" x2="298" y2="160"/><line x1="316" y1="148" x2="316" y2="160"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt"><line x1="530" y1="148" x2="860" y2="148"/><line x1="530" y1="160" x2="860" y2="160"/></g><g stroke="#d32f2f" stroke-width="2"><line x1="542" y1="148" x2="542" y2="160"/><line x1="560" y1="148" x2="560" y2="160"/><line x1="578" y1="148" x2="578" y2="160"/><line x1="596" y1="148" x2="596" y2="160"/><line x1="614" y1="148" x2="614" y2="160"/><line x1="632" y1="148" x2="632" y2="160"/><line x1="650" y1="148" x2="650" y2="160"/><line x1="668" y1="148" x2="668" y2="160"/><line x1="686" y1="148" x2="686" y2="160"/><line x1="704" y1="148" x2="704" y2="160"/><line x1="722" y1="148" x2="722" y2="160"/><line x1="740" y1="148" x2="740" y2="160"/><line x1="758" y1="148" x2="758" y2="160"/><line x1="776" y1="148" x2="776" y2="160"/><line x1="794" y1="148" x2="794" y2="160"/><line x1="812" y1="148" x2="812" y2="160"/><line x1="830" y1="148" x2="830" y2="160"/><line x1="848" y1="148" x2="848" y2="160"/></g>
    <g transform="translate(430 132) scale(1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <g transform="translate(430 176) scale(-1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <circle cx="430" cy="154" r="6" fill="#0f6e56"/>
    <text x="446" y="158" fill="#0f6e56" font-size="12" font-weight="600">optic</text>
    <text x="200" y="210" text-anchor="middle" fill="#185fa5" font-size="13" font-weight="600">left block</text>
    <text x="430" y="220" text-anchor="middle" fill="#44403c" font-size="13" font-weight="600">signals</text>
    <text x="695" y="210" text-anchor="middle" fill="#b42318" font-size="13" font-weight="600">right block</text>
    <text x="36" y="258" fill="#57534e" font-size="13">The optic and the signals sit in the centre. Each block has its own detector.</text>
    <rect x="16" y="302" width="928" height="150" rx="16" fill="#e7f6ef"/>
    <text x="36" y="334" fill="#0f6e56" font-size="16" font-weight="600">Interim</text>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt"><line x1="300" y1="360" x2="660" y2="360"/><line x1="300" y1="372" x2="660" y2="372"/></g><g stroke="#0f6e56" stroke-width="2"><line x1="312" y1="360" x2="312" y2="372"/><line x1="330" y1="360" x2="330" y2="372"/><line x1="348" y1="360" x2="348" y2="372"/><line x1="366" y1="360" x2="366" y2="372"/><line x1="384" y1="360" x2="384" y2="372"/><line x1="402" y1="360" x2="402" y2="372"/><line x1="420" y1="360" x2="420" y2="372"/><line x1="438" y1="360" x2="438" y2="372"/><line x1="456" y1="360" x2="456" y2="372"/><line x1="474" y1="360" x2="474" y2="372"/><line x1="492" y1="360" x2="492" y2="372"/><line x1="510" y1="360" x2="510" y2="372"/><line x1="528" y1="360" x2="528" y2="372"/><line x1="546" y1="360" x2="546" y2="372"/><line x1="564" y1="360" x2="564" y2="372"/><line x1="582" y1="360" x2="582" y2="372"/><line x1="600" y1="360" x2="600" y2="372"/><line x1="618" y1="360" x2="618" y2="372"/><line x1="636" y1="360" x2="636" y2="372"/><line x1="654" y1="360" x2="654" y2="372"/></g>
    <text x="480" y="412" text-anchor="middle" fill="#0f6e56" font-size="13" font-weight="600">block detector</text>
    <text x="480" y="432" text-anchor="middle" fill="#57534e" font-size="12">No signals and no optic.</text>
    <rect x="16" y="468" width="928" height="328" rx="16" fill="#faeeda"/>
    <text x="36" y="500" fill="#854f0b" font-size="16" font-weight="600">Junction *</text>
    <text x="36" y="522" fill="#57534e" font-size="13">Three blocks. The throat block is the approach and the turnout.</text>
    <g stroke="#854f0b" stroke-width="3" stroke-linecap="butt"><line x1="88" y1="575" x2="430" y2="575"/><line x1="88" y1="587" x2="430" y2="587"/></g><g stroke="#854f0b" stroke-width="2"><line x1="100" y1="575" x2="100" y2="587"/><line x1="118" y1="575" x2="118" y2="587"/><line x1="136" y1="575" x2="136" y2="587"/><line x1="154" y1="575" x2="154" y2="587"/><line x1="172" y1="575" x2="172" y2="587"/><line x1="190" y1="575" x2="190" y2="587"/><line x1="208" y1="575" x2="208" y2="587"/><line x1="226" y1="575" x2="226" y2="587"/><line x1="244" y1="575" x2="244" y2="587"/><line x1="262" y1="575" x2="262" y2="587"/><line x1="280" y1="575" x2="280" y2="587"/><line x1="298" y1="575" x2="298" y2="587"/><line x1="316" y1="575" x2="316" y2="587"/><line x1="334" y1="575" x2="334" y2="587"/><line x1="352" y1="575" x2="352" y2="587"/><line x1="370" y1="575" x2="370" y2="587"/></g>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt"><line x1="470" y1="575" x2="800" y2="575"/><line x1="470" y1="587" x2="800" y2="587"/></g><g stroke="#0f6e56" stroke-width="2"><line x1="482" y1="575" x2="482" y2="587"/><line x1="500" y1="575" x2="500" y2="587"/><line x1="518" y1="575" x2="518" y2="587"/><line x1="536" y1="575" x2="536" y2="587"/><line x1="554" y1="575" x2="554" y2="587"/><line x1="572" y1="575" x2="572" y2="587"/><line x1="590" y1="575" x2="590" y2="587"/><line x1="608" y1="575" x2="608" y2="587"/><line x1="626" y1="575" x2="626" y2="587"/><line x1="644" y1="575" x2="644" y2="587"/><line x1="662" y1="575" x2="662" y2="587"/><line x1="680" y1="575" x2="680" y2="587"/><line x1="698" y1="575" x2="698" y2="587"/><line x1="716" y1="575" x2="716" y2="587"/><line x1="734" y1="575" x2="734" y2="587"/><line x1="752" y1="575" x2="752" y2="587"/><line x1="770" y1="575" x2="770" y2="587"/><line x1="788" y1="575" x2="788" y2="587"/></g>
    <g transform="translate(60 581) scale(1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <g transform="translate(840 581) scale(-1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <text x="60" y="612" text-anchor="middle" fill="#57534e" font-size="11">throat</text>
    <text x="840" y="560" text-anchor="middle" fill="#57534e" font-size="11">main</text>
    <path d="M400 587 L500 670" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M412 587 L512 670" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M500 670 L650 755" fill="none" stroke="#185fa5" stroke-width="3" stroke-linecap="round"/>
    <path d="M512 670 L662 755" fill="none" stroke="#185fa5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="418" cy="581" r="6" fill="#0f6e56"/>
    <text x="418" y="556" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">optic</text>
    <g transform="translate(710 748) scale(-1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <text x="748" y="752" fill="#57534e" font-size="11">diverging</text>
    <text x="200" y="632" text-anchor="middle" fill="#854f0b" font-size="13" font-weight="600">throat block</text>
    <text x="650" y="632" text-anchor="middle" fill="#0f6e56" font-size="13" font-weight="600">main block</text>
    <text x="430" y="720" fill="#185fa5" font-size="13" font-weight="600">diverging block</text>
  </g>
</svg>
