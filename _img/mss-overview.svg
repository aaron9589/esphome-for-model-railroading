    <g fill="#44403c" font-size="13">
      <text x="52" y="656">A cascade node bounds the block</text>
      <text x="52" y="674">and carries the signals. Its board</text>
      <text x="52" y="692">subscribes to the named blocks</text>
      <text x="52" y="710">and picks the aspect.</text>

      <text x="344" y="656">Crossover nodes fill the block</text>
      <text x="344" y="674">and have no signals. Any number</text>
      <text x="344" y="692">can sit between cascade nodes.</text>
      <text x="344" y="710">Each detector has its own topic.</text>

      <text x="668" y="656">Current detectors watch each</text>
      <text x="668" y="674">module's feeder. The optical</text>
      <text x="668" y="692">at the boundary occupies both</text>
      <text x="668" y="710">blocks until the train clears.</text>
    </g>

    <rect x="52" y="732" width="886" height="58" rx="12" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="72" y="756" font-size="13" font-weight="600">A missing board holds its blocks occupied, so the signals stay at Stop.</text>
    <text x="72" y="776" fill="#57534e" font-size="13">On the wired bus, a disconnected detector floats clear.</text>
