      <text x="187" y="592" fill="#57534e" font-size="12">signals at the boundary</text>
      <text x="414" y="572" font-size="14" font-weight="600">Crossover node</text>
      <text x="414" y="592" fill="#57534e" font-size="12">no signal</text>
      <text x="576" y="572" font-size="14" font-weight="600">Crossover node</text>
      <text x="576" y="592" fill="#57534e" font-size="12">no signal</text>
      <text x="803" y="572" font-size="14" font-weight="600">Cascade node</text>
