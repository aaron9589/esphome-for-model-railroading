<svg xmlns="http://www.w3.org/2000/svg" width="960" height="810" viewBox="0 0 960 810" role="img" aria-labelledby="ovTitle ovDesc">
  <title id="ovTitle">MSS over MQTT, in the shape of the fundamentals figure</title>
  <desc id="ovDesc">Same arrangement as figure 1.1 in the MSS fundamentals guide. One signal block runs between two cascade nodes, with two crossover nodes between them. Each cascade boundary has two signals, facing opposite ways. The track and the current and optical detectors stay. MQTT replaces the occupancy bus: there are no RJ45 jacks and no crossover cables. Each board publishes its own topics to Mosquitto. A cascade board also subscribes to the named blocks and picks the aspect. A crossover board only publishes its current detector. A missing board holds its blocks occupied.</desc>
