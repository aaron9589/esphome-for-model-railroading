<svg xmlns="http://www.w3.org/2000/svg" width="960" height="588" viewBox="0 0 960 588" role="img" aria-labelledby="title desc">
  <title id="title">Permissive and absolute signals looking at the same occupied block</title>
  <desc id="desc">A permissive signal shows Approach when the next block is occupied. An absolute signal shows Stop while CATS sends Held, and shows Approach once CATS sends Unheld. The board publishes only the aspect name.</desc>
  <rect width="960" height="588" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="34" font-size="18" font-weight="600">The same trains, with and without a dispatcher</text>
    <text x="32" y="56" fill="#57534e" font-size="13">Permissive signals follow the blocks. An absolute signal stays at Stop while CATS is holding it.</text>
    <rect x="16" y="76" width="928" height="236" rx="16" fill="#e7f6ef"/>
    <text x="36" y="108" fill="#0f6e56" font-size="15" font-weight="600">Permissive. No dispatcher on this signal.</text>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="48" y1="146" x2="430" y2="146"/>
      <line x1="48" y1="158" x2="430" y2="158"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2"><line x1="60" y1="146" x2="60" y2="158"/><line x1="78" y1="146" x2="78" y2="158"/><line x1="96" y1="146" x2="96" y2="158"/><line x1="114" y1="146" x2="114" y2="158"/><line x1="132" y1="146" x2="132" y2="158"/><line x1="150" y1="146" x2="150" y2="158"/><line x1="168" y1="146" x2="168" y2="158"/><line x1="186" y1="146" x2="186" y2="158"/><line x1="204" y1="146" x2="204" y2="158"/><line x1="222" y1="146" x2="222" y2="158"/><line x1="240" y1="146" x2="240" y2="158"/><line x1="258" y1="146" x2="258" y2="158"/><line x1="276" y1="146" x2="276" y2="158"/><line x1="294" y1="146" x2="294" y2="158"/><line x1="312" y1="146" x2="312" y2="158"/><line x1="330" y1="146" x2="330" y2="158"/><line x1="348" y1="146" x2="348" y2="158"/><line x1="366" y1="146" x2="366" y2="158"/><line x1="384" y1="146" x2="384" y2="158"/><line x1="402" y1="146" x2="402" y2="158"/><line x1="420" y1="146" x2="420" y2="158"/></g>
    <g stroke="#854f0b" stroke-width="3" stroke-linecap="butt">
      <line x1="462" y1="146" x2="760" y2="146"/>
      <line x1="462" y1="158" x2="760" y2="158"/>
    </g>
    <g stroke="#854f0b" stroke-width="2"><line x1="474" y1="146" x2="474" y2="158"/><line x1="492" y1="146" x2="492" y2="158"/><line x1="510" y1="146" x2="510" y2="158"/><line x1="528" y1="146" x2="528" y2="158"/><line x1="546" y1="146" x2="546" y2="158"/><line x1="564" y1="146" x2="564" y2="158"/><line x1="582" y1="146" x2="582" y2="158"/><line x1="600" y1="146" x2="600" y2="158"/><line x1="618" y1="146" x2="618" y2="158"/><line x1="636" y1="146" x2="636" y2="158"/><line x1="654" y1="146" x2="654" y2="158"/><line x1="672" y1="146" x2="672" y2="158"/><line x1="690" y1="146" x2="690" y2="158"/><line x1="708" y1="146" x2="708" y2="158"/><line x1="726" y1="146" x2="726" y2="158"/><line x1="744" y1="146" x2="744" y2="158"/></g>
    <text x="230" y="138" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">this block · clear</text>
    <text x="610" y="138" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">next block · occupied</text>
    <rect x="560" y="140" width="72" height="32" rx="6" fill="#292524"/>
    <text x="596" y="161" text-anchor="middle" fill="#f4f1ea" font-size="12" font-weight="600">train</text>
    <g transform="translate(80 152) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <rect x="108" y="140" width="96" height="24" rx="8" fill="#faeeda" stroke="#854f0b"/>
    <text x="156.0" y="156" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">Approach</text>
    <text x="48" y="196" fill="#44403c" font-size="13">The block it protects is clear, and the next block is occupied.</text>
    <text x="48" y="218" fill="#44403c" font-size="13">The script shows Approach. CATS is not consulted.</text>
    <text x="48" y="240" fill="#44403c" font-size="13">Leave Absolute unticked. This is the normal signal between stations.</text>
    <rect x="16" y="328" width="928" height="236" rx="16" fill="#faeeda"/>
    <text x="36" y="360" fill="#854f0b" font-size="15" font-weight="600">Absolute. Same track, and CATS is holding the signal.</text>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="48" y1="398" x2="430" y2="398"/>
      <line x1="48" y1="410" x2="430" y2="410"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2"><line x1="60" y1="398" x2="60" y2="410"/><line x1="78" y1="398" x2="78" y2="410"/><line x1="96" y1="398" x2="96" y2="410"/><line x1="114" y1="398" x2="114" y2="410"/><line x1="132" y1="398" x2="132" y2="410"/><line x1="150" y1="398" x2="150" y2="410"/><line x1="168" y1="398" x2="168" y2="410"/><line x1="186" y1="398" x2="186" y2="410"/><line x1="204" y1="398" x2="204" y2="410"/><line x1="222" y1="398" x2="222" y2="410"/><line x1="240" y1="398" x2="240" y2="410"/><line x1="258" y1="398" x2="258" y2="410"/><line x1="276" y1="398" x2="276" y2="410"/><line x1="294" y1="398" x2="294" y2="410"/><line x1="312" y1="398" x2="312" y2="410"/><line x1="330" y1="398" x2="330" y2="410"/><line x1="348" y1="398" x2="348" y2="410"/><line x1="366" y1="398" x2="366" y2="410"/><line x1="384" y1="398" x2="384" y2="410"/><line x1="402" y1="398" x2="402" y2="410"/><line x1="420" y1="398" x2="420" y2="410"/></g>
    <g stroke="#854f0b" stroke-width="3" stroke-linecap="butt">
      <line x1="462" y1="398" x2="760" y2="398"/>
      <line x1="462" y1="410" x2="760" y2="410"/>
    </g>
    <g stroke="#854f0b" stroke-width="2"><line x1="474" y1="398" x2="474" y2="410"/><line x1="492" y1="398" x2="492" y2="410"/><line x1="510" y1="398" x2="510" y2="410"/><line x1="528" y1="398" x2="528" y2="410"/><line x1="546" y1="398" x2="546" y2="410"/><line x1="564" y1="398" x2="564" y2="410"/><line x1="582" y1="398" x2="582" y2="410"/><line x1="600" y1="398" x2="600" y2="410"/><line x1="618" y1="398" x2="618" y2="410"/><line x1="636" y1="398" x2="636" y2="410"/><line x1="654" y1="398" x2="654" y2="410"/><line x1="672" y1="398" x2="672" y2="410"/><line x1="690" y1="398" x2="690" y2="410"/><line x1="708" y1="398" x2="708" y2="410"/><line x1="726" y1="398" x2="726" y2="410"/><line x1="744" y1="398" x2="744" y2="410"/></g>
    <text x="230" y="390" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">this block · clear</text>
    <text x="610" y="390" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">next block · occupied</text>
    <rect x="560" y="392" width="72" height="32" rx="6" fill="#292524"/>
    <text x="596" y="413" text-anchor="middle" fill="#f4f1ea" font-size="12" font-weight="600">train</text>
    <g transform="translate(80 404) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <rect x="108" y="392" width="64" height="24" rx="8" fill="#fde8e8" stroke="#b42318"/>
    <text x="140.0" y="408" text-anchor="middle" fill="#b42318" font-size="12" font-weight="600">Stop</text>
    <text x="48" y="448" fill="#44403c" font-size="13">The mast topic carries Held. The aspect word in that message is ignored.</text>
    <text x="48" y="470" fill="#44403c" font-size="13">The board shows Stop, and publishes only the name of the aspect it is showing.</text>
    <text x="48" y="492" fill="#44403c" font-size="13">Unheld runs the script, so this signal then shows Approach. Points in the block stay put while it is cleared.</text>
  </g>
</svg>
