    <text x="32" y="52" fill="#57534e" font-size="13">Same track. Permissive follows the blocks. Absolute stays at Stop while CATS is holding it.</text>
    <text x="48" y="78" fill="#854f0b" font-size="14" font-weight="600">Permissive. No dispatcher on this signal.</text>
