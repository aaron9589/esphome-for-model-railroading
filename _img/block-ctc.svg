<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title desc">
  <title id="title">A dispatcher, when you want one</title>
  <desc id="desc">A permissive signal shows Approach when the next block is occupied. An absolute signal shows Stop while CATS sends Held, and Approach once CATS sends Unheld.</desc>
