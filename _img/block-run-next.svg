<svg xmlns="http://www.w3.org/2000/svg" width="960" height="616" viewBox="0 0 960 616" role="img" aria-labelledby="title desc">
  <title id="title">4. The train moves to the east block</title>
  <desc id="desc">block/east-board/right is v1 OCCUPIED. East facing that block shows Stop. West reads next and shows Approach.</desc>
