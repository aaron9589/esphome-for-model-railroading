    <rect x="32" y="304" width="896" height="296" rx="12" fill="#fffdf8" stroke="#e7e2d8"/>
        <text x="48" y="332" font-size="13" font-weight="600">Sent</text>
    <text x="48" y="356" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">block/east-board/right                  v1 OCCUPIED</text>
    <text x="48" y="380" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead/east-board/left/next              v1 OCCUPIED</text>
    <text x="48" y="404" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead/gap-board/one/next                v1 OCCUPIED</text>
    <text x="48" y="428" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ahead/gap-board/two/block               v1 CLEAR</text>
    <text x="48" y="460" font-size="13" font-weight="600">Acted on</text>
    <text x="48" y="484" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">east facing east reads its right block  Stop</text>
    <text x="48" y="508" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">west facing east reads one/next         Approach</text>
    <text x="48" y="532" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">east facing west reads two/block        Clear</text>
    <text x="48" y="564" fill="#57534e" font-size="13">This block is clear, so the signal facing it from the east stays Clear.</text>
