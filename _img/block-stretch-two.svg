<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-labelledby="title desc">
  <title id="title">Two blocks, each with an interim</title>
  <desc id="desc">Boundary, interim, boundary, interim, boundary. The first block runs from west to mid. The second runs from mid to east.</desc>
  <rect width="960" height="424" fill="#f4f1ea"/>
