    <circle cx="836.0" cy="174" r="6" fill="#0f6e56"/>
    <text x="777.0" y="270" text-anchor="middle" fill="#854f0b" font-size="11" font-weight="600">left block</text>
    <text x="899.0" y="270" text-anchor="middle" fill="#6d28d9" font-size="11" font-weight="600">right block</text>
    <line x1="154.0" y1="312" x2="458" y2="312" stroke="#d32f2f" stroke-width="2"/><line x1="154.0" y1="304" x2="154.0" y2="320" stroke="#d32f2f" stroke-width="2"/><line x1="458" y1="304" x2="458" y2="320" stroke="#d32f2f" stroke-width="2"/><text x="306.0" y="340" text-anchor="middle" fill="#b42318" font-size="12" font-weight="600">first block</text><line x1="510.0" y1="312" x2="814" y2="312" stroke="#854f0b" stroke-width="2"/><line x1="510.0" y1="304" x2="510.0" y2="320" stroke="#854f0b" stroke-width="2"/><line x1="814" y1="304" x2="814" y2="320" stroke="#854f0b" stroke-width="2"/><text x="662.0" y="340" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">second block</text><text x="32" y="372" fill="#57534e" font-size="13">West's right pairs to near, and near's other end pairs to mid's left.</text><text x="32" y="396" fill="#57534e" font-size="13">Mid's right pairs to far, and far's other end pairs to east's left.</text>
