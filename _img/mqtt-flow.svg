<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">MQTT message flow</title>
  <desc id="flowDesc">Occupancy is published by the ESP32 as ACTIVE or INACTIVE. A point command is CLOSED or THROWN from JMRI, and the ESP32 confirms it on the State topic.</desc>
  <rect width="880" height="400" fill="#f4f1ea"/>

  <rect x="16" y="16" width="848" height="176" rx="16" fill="#e7f6ef"/>
  <text x="36" y="46" fill="#0f6e56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">A train enters a block</text>

  <rect x="36" y="68" width="210" height="72" rx="10" fill="#fffdf8" stroke="#0f6e56"/>
  <text x="141" y="96" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">ESP32</text>
  <text x="141" y="118" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">publishes ACTIVE</text>

  <line x1="246" y1="104" x2="318" y2="104" stroke="#0f6e56" stroke-width="1.75"/>
  <polygon points="328,104 319,99.5 319,108.5" fill="#0f6e56"/>

  <rect x="336" y="68" width="208" height="72" rx="10" fill="#faeeda" stroke="#854f0b"/>
  <text x="440" y="110" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Mosquitto</text>

  <line x1="544" y1="104" x2="616" y2="104" stroke="#0f6e56" stroke-width="1.75"/>
  <polygon points="626,104 617,99.5 617,108.5" fill="#0f6e56"/>

  <rect x="634" y="68" width="210" height="72" rx="10" fill="#fffdf8" stroke="#44403c"/>
  <text x="739" y="96" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">JMRI sensor</text>
  <text x="739" y="118" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">shows occupied</text>

  <rect x="196" y="152" width="488" height="28" rx="8" fill="#fffdf8"/>
  <text x="440" y="171" text-anchor="middle" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">trains/track/sensor/Kiama/Up XOver</text>

  <rect x="16" y="208" width="848" height="176" rx="16" fill="#e8f1fb"/>
  <text x="36" y="238" fill="#185fa5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">JMRI throws a point</text>

  <rect x="36" y="258" width="210" height="72" rx="10" fill="#fffdf8" stroke="#185fa5"/>
  <text x="141" y="286" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">ESP32</text>
  <text x="141" y="308" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">moves the servo</text>

  <line x1="328" y1="286" x2="256" y2="286" stroke="#185fa5" stroke-width="1.75"/>
  <polygon points="246,286 255,281.5 255,290.5" fill="#185fa5"/>
  <text x="287" y="276" text-anchor="middle" fill="#185fa5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">THROWN</text>

  <line x1="246" y1="308" x2="318" y2="308" stroke="#0f6e56" stroke-width="1.75"/>
  <polygon points="328,308 319,303.5 319,312.5" fill="#0f6e56"/>
  <text x="287" y="324" text-anchor="middle" fill="#0f6e56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">/State</text>

  <rect x="336" y="258" width="208" height="72" rx="10" fill="#faeeda" stroke="#854f0b"/>
  <text x="440" y="300" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Mosquitto</text>

  <line x1="626" y1="286" x2="554" y2="286" stroke="#185fa5" stroke-width="1.75"/>
  <polygon points="544,286 553,281.5 553,290.5" fill="#185fa5"/>

  <line x1="544" y1="308" x2="616" y2="308" stroke="#0f6e56" stroke-width="1.75"/>
  <polygon points="626,308 617,303.5 617,312.5" fill="#0f6e56"/>

  <rect x="634" y="258" width="210" height="72" rx="10" fill="#fffdf8" stroke="#44403c"/>
  <text x="739" y="286" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">JMRI turnout</text>
  <text x="739" y="308" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">panel icon updates</text>

  <rect x="176" y="342" width="528" height="28" rx="8" fill="#fffdf8"/>
  <text x="440" y="361" text-anchor="middle" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">trains/track/turnout/Kiama/Up Loop</text>
</svg>
