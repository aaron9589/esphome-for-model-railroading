<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="safeTitle safeDesc">
  <title id="safeTitle">When a publisher on the overview counts as clear</title>
  <desc id="safeDesc">A publisher on the overview is clear only when its board is online and the payload is INACTIVE. An active detector occupies the block. An offline or unheard board occupies the block too, so a missing module shows Stop.</desc>
  <rect width="960" height="460" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="34" font-size="18" font-weight="600">When the overview trusts a publisher</text>
    <text x="32" y="56" fill="#57534e" font-size="13">Clear needs the board ONLINE and this publisher INACTIVE. Anything else occupies the block.</text>

    <rect x="32" y="84" width="288" height="280" rx="12" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="176" y="116" text-anchor="middle" fill="#0f6e56" font-size="13" font-weight="600">Online and INACTIVE</text>
    <rect x="56" y="136" width="240" height="64" rx="8" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="176" y="162" text-anchor="middle" font-size="14" font-weight="600">Board</text>
    <text x="176" y="182" text-anchor="middle" fill="#185fa5" font-size="13" font-weight="600">ONLINE</text>
    <rect x="96" y="212" width="160" height="64" rx="8" fill="#fffdf8" stroke="#0f6e56"/>
    <text x="176" y="238" text-anchor="middle" fill="#0f6e56" font-size="13" font-weight="600">Publisher</text>
    <text x="176" y="258" text-anchor="middle" fill="#0f6e56" font-size="13">INACTIVE</text>
    <text x="176" y="308" text-anchor="middle" font-size="18" font-weight="600">Clear</text>
    <text x="176" y="332" text-anchor="middle" fill="#57534e" font-size="13">from this publisher</text>

    <rect x="336" y="84" width="288" height="280" rx="12" fill="#faeeda" stroke="#854f0b"/>
    <text x="480" y="116" text-anchor="middle" fill="#854f0b" font-size="13" font-weight="600">Online and ACTIVE</text>
    <rect x="360" y="136" width="240" height="64" rx="8" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="480" y="162" text-anchor="middle" font-size="14" font-weight="600">Board</text>
    <text x="480" y="182" text-anchor="middle" fill="#185fa5" font-size="13" font-weight="600">ONLINE</text>
    <rect x="400" y="212" width="160" height="64" rx="8" fill="#fffdf8" stroke="#854f0b"/>
    <text x="480" y="238" text-anchor="middle" fill="#854f0b" font-size="13" font-weight="600">Publisher</text>
    <text x="480" y="258" text-anchor="middle" fill="#854f0b" font-size="13">ACTIVE</text>
    <text x="480" y="308" text-anchor="middle" font-size="18" font-weight="600">Occupied</text>
    <text x="480" y="332" text-anchor="middle" fill="#57534e" font-size="13">train, turnout, or route</text>

    <rect x="640" y="84" width="288" height="280" rx="12" fill="#f5f5f4" stroke="#44403c"/>
    <text x="784" y="116" text-anchor="middle" fill="#44403c" font-size="13" font-weight="600">Offline, or not heard</text>
    <rect x="664" y="136" width="240" height="64" rx="8" fill="#fffdf8" stroke="#44403c"/>
    <text x="784" y="162" text-anchor="middle" font-size="14" font-weight="600">Board</text>
    <text x="784" y="182" text-anchor="middle" fill="#44403c" font-size="13" font-weight="600">OFFLINE</text>
    <rect x="704" y="212" width="160" height="64" rx="8" fill="#f5f5f4" stroke="#a8a29e" stroke-dasharray="4 3"/>
    <text x="784" y="238" text-anchor="middle" fill="#78716c" font-size="13" font-weight="600">Publisher</text>
    <text x="784" y="258" text-anchor="middle" fill="#78716c" font-size="13">unread</text>
    <text x="784" y="308" text-anchor="middle" font-size="18" font-weight="600">Occupied</text>
    <text x="784" y="332" text-anchor="middle" fill="#57534e" font-size="13">the signal holds Stop</text>

    <text x="32" y="404" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">mss/&lt;track&gt;/node/&lt;board&gt;/online</text>
    <text x="360" y="404" fill="#57534e" font-size="13">Retained. Birth is ONLINE. The last will is OFFLINE.</text>
    <text x="32" y="432" fill="#57534e" font-size="13">That last will is the line on every board in the overview. A missing module shows Stop.</text>
  </g>
</svg>
