<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">A plain stretch built from a boundary, an interim, and a boundary</title>
  <desc id="desc">West boundary, an interim, and east boundary, snapped in a row. West's right block, the interim detector, and east's left block are one block. East's right block is the next block.</desc>
  <rect width="960" height="440" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">A plain stretch</text>
    <text x="32" y="58" fill="#57534e" font-size="13">The same pieces, snapped together. West's right block, the interim, and east's left block are one block.</text>
    <rect x="20" y="84" width="380" height="200" rx="16" fill="#e8f1fb"/>
    <rect x="416" y="84" width="164" height="200" rx="16" fill="#e7f6ef"/>
    <rect x="596" y="84" width="344" height="200" rx="16" fill="#e8f1fb"/>
    <text x="210" y="112" text-anchor="middle" fill="#185fa5" font-size="15" font-weight="600">West · boundary *</text>
    <text x="498" y="112" text-anchor="middle" fill="#0f6e56" font-size="15" font-weight="600">Interim</text>
    <text x="768" y="112" text-anchor="middle" fill="#185fa5" font-size="15" font-weight="600">East · boundary *</text>
    <g stroke="#185fa5" stroke-width="3" stroke-linecap="butt"><line x1="40" y1="168" x2="168" y2="168"/><line x1="40" y1="180" x2="168" y2="180"/></g>
    <g stroke="#185fa5" stroke-width="2"><line x1="52" y1="168" x2="52" y2="180"/><line x1="70" y1="168" x2="70" y2="180"/><line x1="88" y1="168" x2="88" y2="180"/><line x1="106" y1="168" x2="106" y2="180"/><line x1="124" y1="168" x2="124" y2="180"/><line x1="142" y1="168" x2="142" y2="180"/><line x1="160" y1="168" x2="160" y2="180"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt"><line x1="248" y1="168" x2="384" y2="168"/><line x1="248" y1="180" x2="384" y2="180"/></g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="260" y1="168" x2="260" y2="180"/><line x1="278" y1="168" x2="278" y2="180"/><line x1="296" y1="168" x2="296" y2="180"/><line x1="314" y1="168" x2="314" y2="180"/><line x1="332" y1="168" x2="332" y2="180"/><line x1="350" y1="168" x2="350" y2="180"/><line x1="368" y1="168" x2="368" y2="180"/></g>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt"><line x1="432" y1="168" x2="564" y2="168"/><line x1="432" y1="180" x2="564" y2="180"/></g>
    <g stroke="#0f6e56" stroke-width="2"><line x1="444" y1="168" x2="444" y2="180"/><line x1="462" y1="168" x2="462" y2="180"/><line x1="480" y1="168" x2="480" y2="180"/><line x1="498" y1="168" x2="498" y2="180"/><line x1="516" y1="168" x2="516" y2="180"/><line x1="534" y1="168" x2="534" y2="180"/><line x1="552" y1="168" x2="552" y2="180"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt"><line x1="616" y1="168" x2="740" y2="168"/><line x1="616" y1="180" x2="740" y2="180"/></g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="628" y1="168" x2="628" y2="180"/><line x1="646" y1="168" x2="646" y2="180"/><line x1="664" y1="168" x2="664" y2="180"/><line x1="682" y1="168" x2="682" y2="180"/><line x1="700" y1="168" x2="700" y2="180"/><line x1="718" y1="168" x2="718" y2="180"/></g>
    <g stroke="#854f0b" stroke-width="3" stroke-linecap="butt"><line x1="820" y1="168" x2="920" y2="168"/><line x1="820" y1="180" x2="920" y2="180"/></g>
    <g stroke="#854f0b" stroke-width="2"><line x1="832" y1="168" x2="832" y2="180"/><line x1="850" y1="168" x2="850" y2="180"/><line x1="868" y1="168" x2="868" y2="180"/><line x1="886" y1="168" x2="886" y2="180"/><line x1="904" y1="168" x2="904" y2="180"/></g>
    <g transform="translate(206 152) scale(1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <g transform="translate(206 196) scale(-1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <circle cx="206" cy="174" r="6" fill="#0f6e56"/>
    <text x="218" y="178" fill="#0f6e56" font-size="11" font-weight="600">optic</text>
    <g transform="translate(778 152) scale(1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <g transform="translate(778 196) scale(-1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <circle cx="778" cy="174" r="6" fill="#0f6e56"/>
    <text x="790" y="178" fill="#0f6e56" font-size="11" font-weight="600">optic</text>
    <text x="104" y="228" text-anchor="middle" fill="#185fa5" font-size="13" font-weight="600">left block</text>
    <text x="206" y="248" text-anchor="middle" fill="#44403c" font-size="13" font-weight="600">signals</text>
    <text x="316" y="228" text-anchor="middle" fill="#b42318" font-size="13" font-weight="600">right block</text>
    <text x="498" y="228" text-anchor="middle" fill="#0f6e56" font-size="13" font-weight="600">block detector</text>
    <text x="498" y="248" text-anchor="middle" fill="#57534e" font-size="12">No signals. No optic.</text>
    <text x="678" y="228" text-anchor="middle" fill="#b42318" font-size="13" font-weight="600">left block</text>
    <text x="778" y="248" text-anchor="middle" fill="#44403c" font-size="13" font-weight="600">signals</text>
    <text x="870" y="228" text-anchor="middle" fill="#854f0b" font-size="13" font-weight="600">right block</text>
    <text x="870" y="248" text-anchor="middle" fill="#57534e" font-size="12">next block</text>
    <line x1="248" y1="312" x2="740" y2="312" stroke="#d32f2f" stroke-width="2"/>
    <line x1="248" y1="304" x2="248" y2="320" stroke="#d32f2f" stroke-width="2"/>
    <line x1="740" y1="304" x2="740" y2="320" stroke="#d32f2f" stroke-width="2"/>
    <text x="494" y="340" text-anchor="middle" fill="#b42318" font-size="13" font-weight="600">one block</text>
    <text x="32" y="380" fill="#57534e" font-size="13">West's right end pairs to the interim's one end. The interim's two end pairs to east's left.</text>
    <text x="32" y="404" fill="#57534e" font-size="13">The signals that face this block protect it. East's signal facing the other way protects the next block.</text>
  </g>
</svg>
