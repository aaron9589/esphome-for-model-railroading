<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">A boundary, an interim, and a boundary forming one block</title>
  <desc id="desc">West and east are boundaries. The interim between them publishes its detector and passes the postcard through, adding its detector to BLOCK. The track past east is the next block.</desc>
  <rect width="960" height="520" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">One block, with an interim in it</text>
    <text x="32" y="58" fill="#57534e" font-size="13">West and east are boundaries. The interim between them belongs to that block. Past east is the next block.</text>
    <g stroke="#a8a29e" stroke-width="3" stroke-linecap="butt">
      <line x1="48" y1="100" x2="140" y2="100"/>
      <line x1="48" y1="112" x2="140" y2="112"/>
    </g>
    <g stroke="#a8a29e" stroke-width="2"><line x1="60" y1="100" x2="60" y2="112"/><line x1="78" y1="100" x2="78" y2="112"/><line x1="96" y1="100" x2="96" y2="112"/><line x1="114" y1="100" x2="114" y2="112"/><line x1="132" y1="100" x2="132" y2="112"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
      <line x1="180" y1="100" x2="600" y2="100"/>
      <line x1="180" y1="112" x2="600" y2="112"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="192" y1="100" x2="192" y2="112"/><line x1="210" y1="100" x2="210" y2="112"/><line x1="228" y1="100" x2="228" y2="112"/><line x1="246" y1="100" x2="246" y2="112"/><line x1="264" y1="100" x2="264" y2="112"/><line x1="282" y1="100" x2="282" y2="112"/><line x1="300" y1="100" x2="300" y2="112"/><line x1="318" y1="100" x2="318" y2="112"/><line x1="336" y1="100" x2="336" y2="112"/><line x1="354" y1="100" x2="354" y2="112"/><line x1="372" y1="100" x2="372" y2="112"/><line x1="390" y1="100" x2="390" y2="112"/><line x1="408" y1="100" x2="408" y2="112"/><line x1="426" y1="100" x2="426" y2="112"/><line x1="444" y1="100" x2="444" y2="112"/><line x1="462" y1="100" x2="462" y2="112"/><line x1="480" y1="100" x2="480" y2="112"/><line x1="498" y1="100" x2="498" y2="112"/><line x1="516" y1="100" x2="516" y2="112"/><line x1="534" y1="100" x2="534" y2="112"/><line x1="552" y1="100" x2="552" y2="112"/><line x1="570" y1="100" x2="570" y2="112"/><line x1="588" y1="100" x2="588" y2="112"/></g>
    <g stroke="#a8a29e" stroke-width="3" stroke-linecap="butt">
      <line x1="660" y1="100" x2="912" y2="100"/>
      <line x1="660" y1="112" x2="912" y2="112"/>
    </g>
    <g stroke="#a8a29e" stroke-width="2"><line x1="672" y1="100" x2="672" y2="112"/><line x1="690" y1="100" x2="690" y2="112"/><line x1="708" y1="100" x2="708" y2="112"/><line x1="726" y1="100" x2="726" y2="112"/><line x1="744" y1="100" x2="744" y2="112"/><line x1="762" y1="100" x2="762" y2="112"/><line x1="780" y1="100" x2="780" y2="112"/><line x1="798" y1="100" x2="798" y2="112"/><line x1="816" y1="100" x2="816" y2="112"/><line x1="834" y1="100" x2="834" y2="112"/><line x1="852" y1="100" x2="852" y2="112"/><line x1="870" y1="100" x2="870" y2="112"/><line x1="888" y1="100" x2="888" y2="112"/></g>
    <g transform="translate(160 106) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <g transform="translate(160 142) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <g transform="translate(620 106) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <g transform="translate(620 142) scale(-1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="160" y="178" text-anchor="middle" fill="#185fa5" font-size="12" font-weight="600">west</text>
    <text x="470" y="128" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">interim</text>
    <text x="620" y="178" text-anchor="middle" fill="#185fa5" font-size="12" font-weight="600">east</text>
    <text x="786" y="128" text-anchor="middle" fill="#78716c" font-size="12">next block</text>
    <rect x="32" y="200" width="300" height="248" rx="12" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="182.0" y="228" text-anchor="middle" font-size="15" font-weight="600">west · boundary</text>
    <text x="48" y="248" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">detect/west-board/right</text>
    <text x="48" y="270" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">joint/west-board</text>
    <text x="48" y="292" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ahead/west-board/right</text>
    <text x="48" y="322" fill="#57534e" font-size="13">Right neighbour</text>
    <text x="48" y="340" fill="#57534e" font-size="13">gap-board/one</text>
    <rect x="344" y="200" width="272" height="248" rx="12" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="480.0" y="228" text-anchor="middle" font-size="15" font-weight="600">gap · interim</text>
    <text x="360" y="248" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">detect/gap-board</text>
    <text x="360" y="270" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ahead/gap-board/one</text>
    <text x="360" y="292" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ahead/gap-board/two</text>
    <text x="360" y="322" fill="#57534e" font-size="13">end one</text>
    <text x="360" y="340" fill="#57534e" font-size="13">west-board/right</text>
    <text x="360" y="368" fill="#57534e" font-size="13">end two</text>
    <text x="360" y="386" fill="#57534e" font-size="13">east-board/left</text>
    <rect x="628" y="200" width="300" height="248" rx="12" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="778.0" y="228" text-anchor="middle" font-size="15" font-weight="600">east · boundary</text>
    <text x="644" y="248" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">detect/east-board/left</text>
    <text x="644" y="270" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">joint/east-board</text>
    <text x="644" y="292" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ahead/east-board/left</text>
    <text x="644" y="322" fill="#57534e" font-size="13">Left neighbour</text>
    <text x="644" y="340" fill="#57534e" font-size="13">gap-board/two</text>
    <text x="32" y="472" fill="#57534e" font-size="13">Another interim paired between these two would add its detector to the same block. NEXT still names the block past east.</text>
    <text x="32" y="494" fill="#57534e" font-size="13">Pair west/right straight to east/left and the interim is simply absent. The postcards meet.</text>
  </g>
</svg>
