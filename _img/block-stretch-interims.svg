    <text x="340.0" y="84" text-anchor="middle" fill="#0f6e56" font-size="13" font-weight="600">Near</text>
    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt"><line x1="290" y1="168" x2="390" y2="168"/><line x1="290" y1="180" x2="390" y2="180"/></g><g stroke="#0f6e56" stroke-width="2"><line x1="300" y1="168" x2="300" y2="180"/><line x1="316" y1="168" x2="316" y2="180"/><line x1="332" y1="168" x2="332" y2="180"/><line x1="348" y1="168" x2="348" y2="180"/><line x1="364" y1="168" x2="364" y2="180"/><line x1="380" y1="168" x2="380" y2="180"/></g>
    <text x="340.0" y="270" text-anchor="middle" fill="#0f6e56" font-size="11" font-weight="600">detector</text>
