    <g transform="translate(819.0 196) scale(-1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <circle cx="819.0" cy="174" r="6" fill="#0f6e56"/>
    <text x="743.0" y="270" text-anchor="middle" fill="#b42318" font-size="11" font-weight="600">left block</text>
    <text x="890.5" y="270" text-anchor="middle" fill="#854f0b" font-size="11" font-weight="600">right block</text>
    <line x1="171.0" y1="312" x2="780" y2="312" stroke="#d32f2f" stroke-width="2"/><line x1="171.0" y1="304" x2="171.0" y2="320" stroke="#d32f2f" stroke-width="2"/><line x1="780" y1="304" x2="780" y2="320" stroke="#d32f2f" stroke-width="2"/><text x="475.5" y="342" text-anchor="middle" fill="#b42318" font-size="13" font-weight="600">one block</text><text x="32" y="376" fill="#57534e" font-size="13">West's right end pairs to near. Near pairs to mid, mid pairs to far, and far pairs to east's left.</text><text x="32" y="400" fill="#57534e" font-size="13">A train on any interim occupies this whole block. The signals that face it show Stop.</text>
  </g>
</svg>
