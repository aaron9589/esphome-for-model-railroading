    <text x="32" y="58" fill="#57534e" font-size="13">Two more interims in the same block. They do not add a signal.</text>
    <rect x="16" y="100" width="250" height="188" rx="14" fill="#e8f1fb"/>
    <text x="141.0" y="84" text-anchor="middle" fill="#185fa5" font-size="13" font-weight="600">West · boundary *</text>
