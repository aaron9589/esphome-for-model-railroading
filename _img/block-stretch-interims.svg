<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-labelledby="title desc">
  <title id="title">Three interims in one block</title>
  <desc id="desc">West boundary, three interims, and east boundary. West's right block, the three detectors, and east's left block are one block.</desc>
