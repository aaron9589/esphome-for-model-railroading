    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt"><line x1="171.0" y1="168" x2="254" y2="168"/><line x1="171.0" y1="180" x2="254" y2="180"/></g><g stroke="#d32f2f" stroke-width="2"><line x1="181.0" y1="168" x2="181.0" y2="180"/><line x1="197.0" y1="168" x2="197.0" y2="180"/><line x1="213.0" y1="168" x2="213.0" y2="180"/><line x1="229.0" y1="168" x2="229.0" y2="180"/><line x1="245.0" y1="168" x2="245.0" y2="180"/></g>
    <g transform="translate(141.0 152) scale(1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <g transform="translate(141.0 196) scale(-1 1)"><circle cx="0" cy="0" r="11" fill="#292524"/><circle cx="0" cy="0" r="5" fill="#f4f1ea"/><polygon points="14,-4 24,0 14,4" fill="#1c1917"/></g>
    <circle cx="141.0" cy="174" r="6" fill="#0f6e56"/>
    <text x="65.0" y="270" text-anchor="middle" fill="#185fa5" font-size="11" font-weight="600">left block</text>
    <text x="212.5" y="270" text-anchor="middle" fill="#b42318" font-size="11" font-weight="600">right block</text>
