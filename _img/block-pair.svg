<svg xmlns="http://www.w3.org/2000/svg" width="960" height="364" viewBox="0 0 960 364" role="img" aria-labelledby="title desc">
  <title id="title">Pairing two ends from the pair topic</title>
  <desc id="desc">Flash blinks one side so you can see it. Pair on one end publishes OFFER. Pair on the other board publishes ACCEPT. Each end stores the other address and the signals flash three times.</desc>
  <rect width="960" height="364" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">Pair one end, then the other</text>
    <text x="32" y="58" fill="#57534e" font-size="13">Flash shows you which side that button is. Pair writes the two ends as neighbours.</text>
    <rect x="32" y="84" width="288" height="168" rx="12" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="176" y="116" text-anchor="middle" font-size="15" font-weight="600">1. Flash</text>
    <text x="176" y="148" text-anchor="middle" fill="#44403c" font-size="13">Blink the signals on</text>
    <text x="176" y="170" text-anchor="middle" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">that side. Nothing</text>
    <text x="176" y="200" text-anchor="middle" fill="#57534e" font-size="13">is stored.</text>
    <rect x="336" y="84" width="288" height="168" rx="12" fill="#faeeda" stroke="#854f0b"/>
    <text x="480" y="116" text-anchor="middle" font-size="15" font-weight="600">2. Pair on west</text>
    <text x="480" y="148" text-anchor="middle" fill="#44403c" font-size="13">Publishes v1 OFFER</text>
    <text x="480" y="170" text-anchor="middle" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">west-board/right</text>
    <text x="480" y="200" text-anchor="middle" fill="#57534e" font-size="13">and keeps flashing.</text>
    <rect x="640" y="84" width="288" height="168" rx="12" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="784" y="116" text-anchor="middle" font-size="15" font-weight="600">3. Pair on east</text>
    <text x="784" y="148" text-anchor="middle" fill="#44403c" font-size="13">Publishes v1 ACCEPT</text>
    <text x="784" y="170" text-anchor="middle" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">east-board/left WITH</text>
    <text x="784" y="188" text-anchor="middle" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">west-board/right</text>
    <text x="784" y="214" text-anchor="middle" fill="#57534e" font-size="13">Both ends store it.</text>
    <text x="32" y="284" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">mss/main/pair</text>
    <text x="180" y="284" fill="#57534e" font-size="13">Not retained. An offer lasts 30 seconds. A new offer replaces it.</text>
    <text x="32" y="312" fill="#57534e" font-size="13">West stores east-board/left on its right. East stores west-board/right on its left. Then both flash three slow blinks.</text>
    <text x="32" y="336" fill="#57534e" font-size="13">An interim has no signals, so only the board that has them flashes. The neighbour address still shows on the web page.</text>
  </g>
</svg>
