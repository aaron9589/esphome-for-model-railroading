<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="aspTitle aspDesc">
  <title id="aspTitle">How the left-hand signal on the overview picks an aspect</title>
  <desc id="aspDesc">The left-hand signal on the overview faces the blocks ahead. Stop if the block it protects is occupied. Approach or Approach Diverging from the next block. Advance Approach from the block after that. Clear or Dark from the block behind. The first match wins.</desc>
  <rect width="960" height="560" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="34" font-size="18" font-weight="600">The left-hand signal, looking ahead</text>
    <text x="32" y="56" fill="#57534e" font-size="13">Same track as the overview. The first match wins, from the top of this list down.</text>

    <rect x="32" y="84" width="200" height="78" rx="12" fill="#f5f5f4"/>
    <rect x="252" y="84" width="220" height="78" rx="12" fill="#fde8e8"/>
    <rect x="492" y="84" width="220" height="78" rx="12" fill="#faeeda"/>
    <rect x="732" y="84" width="196" height="78" rx="12" fill="#e8f1fb"/>

    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
      <line x1="44" y1="112" x2="220" y2="112"/><line x1="44" y1="124" x2="220" y2="124"/>
      <line x1="268" y1="112" x2="460" y2="112"/><line x1="268" y1="124" x2="460" y2="124"/>
      <line x1="508" y1="112" x2="700" y2="112"/><line x1="508" y1="124" x2="700" y2="124"/>
      <line x1="748" y1="112" x2="916" y2="112"/><line x1="748" y1="124" x2="916" y2="124"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2">
      <line x1="56" y1="112" x2="56" y2="124"/><line x1="74" y1="112" x2="74" y2="124"/><line x1="92" y1="112" x2="92" y2="124"/><line x1="110" y1="112" x2="110" y2="124"/><line x1="128" y1="112" x2="128" y2="124"/><line x1="146" y1="112" x2="146" y2="124"/><line x1="164" y1="112" x2="164" y2="124"/><line x1="182" y1="112" x2="182" y2="124"/><line x1="200" y1="112" x2="200" y2="124"/>
      <line x1="280" y1="112" x2="280" y2="124"/><line x1="298" y1="112" x2="298" y2="124"/><line x1="316" y1="112" x2="316" y2="124"/><line x1="334" y1="112" x2="334" y2="124"/><line x1="352" y1="112" x2="352" y2="124"/><line x1="370" y1="112" x2="370" y2="124"/><line x1="388" y1="112" x2="388" y2="124"/><line x1="406" y1="112" x2="406" y2="124"/><line x1="424" y1="112" x2="424" y2="124"/><line x1="442" y1="112" x2="442" y2="124"/>
      <line x1="520" y1="112" x2="520" y2="124"/><line x1="538" y1="112" x2="538" y2="124"/><line x1="556" y1="112" x2="556" y2="124"/><line x1="574" y1="112" x2="574" y2="124"/><line x1="592" y1="112" x2="592" y2="124"/><line x1="610" y1="112" x2="610" y2="124"/><line x1="628" y1="112" x2="628" y2="124"/><line x1="646" y1="112" x2="646" y2="124"/><line x1="664" y1="112" x2="664" y2="124"/><line x1="682" y1="112" x2="682" y2="124"/>
      <line x1="760" y1="112" x2="760" y2="124"/><line x1="778" y1="112" x2="778" y2="124"/><line x1="796" y1="112" x2="796" y2="124"/><line x1="814" y1="112" x2="814" y2="124"/><line x1="832" y1="112" x2="832" y2="124"/><line x1="850" y1="112" x2="850" y2="124"/><line x1="868" y1="112" x2="868" y2="124"/><line x1="886" y1="112" x2="886" y2="124"/><line x1="904" y1="112" x2="904" y2="124"/>
    </g>

    <g transform="translate(242 148)">
      <line x1="0" y1="14" x2="0" y2="36" stroke="#44403c" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="276" y="152" fill="#44403c" font-size="12">protects this block</text>

    <g fill="#57534e" font-size="12" font-weight="600" text-anchor="middle">
      <text x="132" y="104">Behind</text>
      <text x="362" y="104">This block</text>
      <text x="602" y="104">Next</text>
      <text x="830" y="104">Two ahead</text>
    </g>

    <rect x="32" y="210" width="200" height="250" rx="12" fill="#f5f5f4"/>
    <rect x="252" y="210" width="220" height="250" rx="12" fill="#fde8e8" stroke="#b42318"/>
    <rect x="492" y="210" width="220" height="250" rx="12" fill="#faeeda" stroke="#854f0b"/>
    <rect x="732" y="210" width="196" height="250" rx="12" fill="#e8f1fb" stroke="#185fa5"/>

    <g text-anchor="middle">
      <text x="132" y="242" fill="#44403c" font-size="15" font-weight="600">Behind</text>
      <text x="132" y="270" fill="#57534e" font-size="13">A train here, and</text>
      <text x="132" y="290" fill="#57534e" font-size="13">the road ahead</text>
      <text x="132" y="310" fill="#57534e" font-size="13">is clear</text>
      <text x="132" y="338" fill="#0f6e56" font-size="15" font-weight="600">Clear</text>
      <text x="132" y="366" fill="#57534e" font-size="13">Empty, ahead clear,</text>
      <text x="132" y="386" fill="#57534e" font-size="13">lighting on</text>
      <text x="132" y="414" fill="#44403c" font-size="15" font-weight="600">Dark</text>
      <text x="132" y="438" fill="#78716c" font-size="12">lighting off shows Clear</text>

      <text x="362" y="242" fill="#9f1239" font-size="15" font-weight="600">Protects</text>
      <text x="362" y="270" fill="#57534e" font-size="13">Occupied</text>
      <text x="362" y="302" fill="#9f1239" font-size="15" font-weight="600">Stop</text>
      <text x="362" y="334" fill="#57534e" font-size="13">This is the block</text>
      <text x="362" y="354" fill="#57534e" font-size="13">between the two</text>
      <text x="362" y="374" fill="#57534e" font-size="13">cascade signals</text>
      <text x="362" y="394" fill="#57534e" font-size="13">on the overview.</text>
      <text x="362" y="424" fill="#78716c" font-size="12">Stop wins over the rest.</text>

      <text x="602" y="242" fill="#854f0b" font-size="15" font-weight="600">Next</text>
      <text x="602" y="270" fill="#57534e" font-size="13">Occupied</text>
      <text x="602" y="298" fill="#854f0b" font-size="15" font-weight="600">Approach</text>
      <text x="602" y="330" fill="#57534e" font-size="13">Diverging, and</text>
      <text x="602" y="350" fill="#57534e" font-size="13">that block clear</text>
      <text x="602" y="378" fill="#854f0b" font-size="15" font-weight="600">Approach</text>
      <text x="602" y="398" fill="#854f0b" font-size="15" font-weight="600">Diverging</text>
      <text x="602" y="428" fill="#78716c" font-size="12">replaces Approach, only then</text>

      <text x="830" y="242" fill="#185fa5" font-size="15" font-weight="600">Two ahead</text>
      <text x="830" y="270" fill="#57534e" font-size="13">Occupied, and the</text>
      <text x="830" y="290" fill="#57534e" font-size="13">nearer blocks</text>
      <text x="830" y="310" fill="#57534e" font-size="13">are clear</text>
      <text x="830" y="346" fill="#185fa5" font-size="15" font-weight="600">Advance</text>
      <text x="830" y="366" fill="#185fa5" font-size="15" font-weight="600">Approach</text>
      <text x="830" y="400" fill="#78716c" font-size="12">Optional, like Approach</text>
      <text x="830" y="418" fill="#78716c" font-size="12">Diverging.</text>
    </g>

    <text x="32" y="496" fill="#57534e" font-size="13">The signal starts at Stop until the other boards have reported in. Advance Approach, Approach Diverging, and approach lighting are optional.</text>
    <text x="32" y="520" fill="#57534e" font-size="13">Stop, Approach, and Clear are not. On the overview this is the signal at the left cascade, facing into the block.</text>
  </g>
</svg>
