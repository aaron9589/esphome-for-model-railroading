<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="jntTitle jntDesc">
  <title id="jntTitle">A cascade on the overview where the track splits</title>
  <desc id="jntDesc">A junction is a cascade node. When the diverging route is lined, the main block is held occupied and the diverging indication is ACTIVE only if the diverging block is clear. When the main is lined, the diverging block is held occupied and the diverging indication is INACTIVE.</desc>
  <rect width="960" height="640" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="32" font-size="18" font-weight="600">A cascade where the track splits</text>
    <text x="32" y="54" fill="#57534e" font-size="13">The junction on the overview. The board publishes the route as well as the detectors.</text>

    <rect x="16" y="72" width="928" height="268" rx="16" fill="#faeeda"/>
    <text x="36" y="102" fill="#854f0b" font-size="15" font-weight="600">Diverging is lined, and that block is clear</text>

    <g transform="translate(78 150)">
      <line x1="0" y1="14" x2="0" y2="36" stroke="#44403c" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="78" y="204" text-anchor="middle" fill="#57534e" font-size="11">signal</text>

    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="108" y1="144" x2="210" y2="144"/>
      <line x1="108" y1="156" x2="210" y2="156"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2">
      <line x1="120" y1="144" x2="120" y2="156"/><line x1="138" y1="144" x2="138" y2="156"/><line x1="156" y1="144" x2="156" y2="156"/><line x1="174" y1="144" x2="174" y2="156"/><line x1="192" y1="144" x2="192" y2="156"/>
    </g>
    <text x="160" y="132" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">protects · clear</text>

    <g stroke="#854f0b" stroke-width="3" stroke-linecap="butt">
      <line x1="228" y1="144" x2="430" y2="144"/>
      <line x1="228" y1="156" x2="400" y2="156"/>
    </g>
    <g stroke="#854f0b" stroke-width="2">
      <line x1="244" y1="144" x2="244" y2="156"/><line x1="262" y1="144" x2="262" y2="156"/><line x1="280" y1="144" x2="280" y2="156"/><line x1="298" y1="144" x2="298" y2="156"/><line x1="316" y1="144" x2="316" y2="156"/><line x1="334" y1="144" x2="334" y2="156"/><line x1="352" y1="144" x2="352" y2="156"/><line x1="370" y1="144" x2="370" y2="156"/>
    </g>
    <path d="M400 156 L470 214" fill="none" stroke="#0f6e56" stroke-width="3" stroke-linecap="round"/>
    <path d="M388 156 L458 214" fill="none" stroke="#0f6e56" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#0f6e56" stroke-width="2">
      <line x1="418" y1="176" x2="426" y2="184"/><line x1="436" y1="194" x2="444" y2="202"/>
    </g>
    <text x="320" y="132" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">main · held occupied</text>
    <text x="478" y="236" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">diverging · clear</text>

    <rect x="500" y="168" width="132" height="36" rx="8" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="566" y="191" text-anchor="middle" font-size="12" font-weight="600">Cascade board</text>

    <text x="648" y="156" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">…/&lt;main&gt;/route/&lt;name&gt;</text>
    <rect x="848" y="140" width="76" height="22" rx="6" fill="#fde8e8"/>
    <text x="886" y="156" text-anchor="middle" fill="#9f1239" font-size="12" font-weight="600">ACTIVE</text>

    <text x="648" y="192" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">…/&lt;diverging&gt;/route/&lt;name&gt;</text>
    <rect x="848" y="176" width="76" height="22" rx="6" fill="#e7f6ef"/>
    <text x="886" y="192" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">INACTIVE</text>

    <text x="648" y="228" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">…/diverging/&lt;board&gt;/&lt;name&gt;</text>
    <rect x="848" y="212" width="76" height="22" rx="6" fill="#faeeda" stroke="#854f0b"/>
    <text x="886" y="228" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">ACTIVE</text>

    <text x="36" y="292" fill="#44403c" font-size="13">The signal one block before shows Approach Diverging.</text>
    <text x="36" y="314" fill="#44403c" font-size="13">Without that aspect it still sees the main block occupied, so it shows Approach.</text>

    <rect x="16" y="356" width="928" height="268" rx="16" fill="#e8f1fb"/>
    <text x="36" y="386" fill="#185fa5" font-size="15" font-weight="600">Main is lined</text>

    <g transform="translate(78 434)">
      <line x1="0" y1="14" x2="0" y2="36" stroke="#44403c" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="78" y="488" text-anchor="middle" fill="#57534e" font-size="11">signal</text>

    <g stroke="#0f6e56" stroke-width="3" stroke-linecap="butt">
      <line x1="108" y1="428" x2="430" y2="428"/>
      <line x1="108" y1="440" x2="400" y2="440"/>
    </g>
    <g stroke="#0f6e56" stroke-width="2">
      <line x1="120" y1="428" x2="120" y2="440"/><line x1="140" y1="428" x2="140" y2="440"/><line x1="160" y1="428" x2="160" y2="440"/><line x1="180" y1="428" x2="180" y2="440"/><line x1="200" y1="428" x2="200" y2="440"/><line x1="220" y1="428" x2="220" y2="440"/><line x1="240" y1="428" x2="240" y2="440"/><line x1="260" y1="428" x2="260" y2="440"/><line x1="280" y1="428" x2="280" y2="440"/><line x1="300" y1="428" x2="300" y2="440"/><line x1="320" y1="428" x2="320" y2="440"/><line x1="340" y1="428" x2="340" y2="440"/><line x1="360" y1="428" x2="360" y2="440"/><line x1="380" y1="428" x2="380" y2="440"/>
    </g>
    <path d="M400 440 L470 498" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M388 440 L458 498" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#854f0b" stroke-width="2">
      <line x1="418" y1="460" x2="426" y2="468"/><line x1="436" y1="478" x2="444" y2="486"/>
    </g>
    <text x="160" y="416" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">protects · clear</text>
    <text x="330" y="416" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">main · from its detectors</text>
    <text x="430" y="522" text-anchor="middle" fill="#854f0b" font-size="12" font-weight="600">diverging · held occupied</text>

    <rect x="500" y="452" width="132" height="36" rx="8" fill="#fffdf8" stroke="#185fa5"/>
    <text x="566" y="475" text-anchor="middle" font-size="12" font-weight="600">Cascade board</text>

    <text x="648" y="440" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">…/&lt;main&gt;/route/&lt;name&gt;</text>
    <rect x="848" y="424" width="76" height="22" rx="6" fill="#e7f6ef"/>
    <text x="886" y="440" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">INACTIVE</text>

    <text x="648" y="476" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">…/&lt;diverging&gt;/route/&lt;name&gt;</text>
    <rect x="848" y="460" width="76" height="22" rx="6" fill="#fde8e8"/>
    <text x="886" y="476" text-anchor="middle" fill="#9f1239" font-size="12" font-weight="600">ACTIVE</text>

    <text x="648" y="512" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">…/diverging/&lt;board&gt;/&lt;name&gt;</text>
    <rect x="848" y="496" width="76" height="22" rx="6" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="886" y="512" text-anchor="middle" fill="#185fa5" font-size="12" font-weight="600">INACTIVE</text>

    <text x="36" y="572" fill="#44403c" font-size="13">The signal follows the main block. Nothing shows Clear into the misaligned diverging route.</text>
    <text x="36" y="594" fill="#44403c" font-size="13">Advance Approach stays on the one block you named. It does not swap when the junction is thrown.</text>
  </g>
</svg>
