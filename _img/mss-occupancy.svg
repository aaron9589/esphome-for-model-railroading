      <line x1="815" y1="124" x2="932" y2="124"/>
      <line x1="815" y1="136" x2="932" y2="136"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2">
      <line x1="40" y1="124" x2="40" y2="136"/><line x1="58" y1="124" x2="58" y2="136"/><line x1="76" y1="124" x2="76" y2="136"/><line x1="94" y1="124" x2="94" y2="136"/><line x1="112" y1="124" x2="112" y2="136"/><line x1="130" y1="124" x2="130" y2="136"/><line x1="148" y1="124" x2="148" y2="136"/><line x1="166" y1="124" x2="166" y2="136"/>
