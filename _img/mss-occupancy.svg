      <text x="414" y="254" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">Current</text>
      <text x="414" y="272" text-anchor="middle" fill="#57534e" font-size="11">feeder</text>
      <text x="414" y="290" text-anchor="middle" fill="#185fa5" font-size="11" font-weight="600">this block</text>

