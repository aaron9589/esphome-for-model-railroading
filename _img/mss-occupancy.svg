    <rect x="32" y="356" width="290" height="176" rx="12" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="52" y="386" font-size="15" font-weight="600">Current detector</text>
    <text x="52" y="410" fill="#57534e" font-size="13">On a feeder inside this block.</text>
    <text x="52" y="430" fill="#57534e" font-size="13">One topic, this block only.</text>
    <text x="52" y="462" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">…/&lt;block&gt;/&lt;board&gt;/current/&lt;name&gt;</text>
    <text x="52" y="490" fill="#57534e" font-size="13">The gray chips are the next block</text>
    <text x="52" y="508" fill="#57534e" font-size="13">and the one behind.</text>

    <rect x="336" y="356" width="290" height="176" rx="12" fill="#fffdf8" stroke="#e7e2d8"/>
    <text x="356" y="386" font-size="15" font-weight="600">Optical at the boundary</text>
    <text x="356" y="410" fill="#57534e" font-size="13">One sensor, both blocks, until</text>
    <text x="356" y="430" fill="#57534e" font-size="13">the last car clears the gap.</text>
    <text x="356" y="462" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">mss/main/south/south/optical/gap</text>
    <text x="356" y="484" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">mss/main/mid/south/optical/gap</text>
    <text x="356" y="508" fill="#57534e" font-size="13">Same payload, two topics.</text>

    <rect x="640" y="356" width="288" height="176" rx="12" fill="#faeeda" stroke="#854f0b"/>
    <text x="660" y="386" font-size="15" font-weight="600">Turnout against the route</text>
    <text x="660" y="410" fill="#57534e" font-size="13">The amber branch on the track.</text>
    <text x="660" y="430" fill="#57534e" font-size="13">ACTIVE occupies this block.</text>
    <text x="660" y="462" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">…/&lt;block&gt;/&lt;board&gt;/turnout/&lt;name&gt;</text>
    <text x="660" y="490" fill="#57534e" font-size="13">Lined for the signaled route,</text>
    <text x="660" y="508" fill="#57534e" font-size="13">this publisher is INACTIVE.</text>
