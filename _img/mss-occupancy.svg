<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="occTitle occDesc">
  <title id="occTitle">What occupies the signal block on the overview</title>
  <desc id="occDesc">The detection row of the overview. Current detectors on feeders inside the signal block occupy that block. The optical detector at each boundary occupies both blocks. A turnout set against the signaled route occupies the block. Any one active publisher is enough.</desc>
  <rect width="960" height="560" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="52" y="34" font-size="18" font-weight="600">What occupies this block</text>
    <text x="52" y="56" fill="#57534e" font-size="13">The detection row of the overview. Any one of these publishers is enough.</text>

    <text x="495" y="84" text-anchor="middle" fill="#44403c" font-size="12" font-weight="600" letter-spacing="0.08em">ONE SIGNAL BLOCK</text>
    <line x1="187" y1="94" x2="803" y2="94" stroke="#44403c" stroke-width="1.5"/>
    <line x1="187" y1="86" x2="187" y2="102" stroke="#44403c" stroke-width="1.5"/>
    <line x1="803" y1="86" x2="803" y2="102" stroke="#44403c" stroke-width="1.5"/>

    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
