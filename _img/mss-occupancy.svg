    <path d="M452 136 L512 184" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M452 124 L500 172" fill="none" stroke="#854f0b" stroke-width="3" stroke-linecap="round"/>
    <text x="518" y="180" fill="#854f0b" font-size="11" font-weight="600">turnout</text>

