      <text x="576" y="254" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">Current</text>
      <text x="576" y="272" text-anchor="middle" fill="#57534e" font-size="11">feeder</text>
      <text x="576" y="290" text-anchor="middle" fill="#185fa5" font-size="11" font-weight="600">this block</text>

      <rect x="680" y="228" width="78" height="78" rx="8" fill="#e7f6ef" stroke="#0f6e56"/>
      <text x="719" y="254" text-anchor="middle" fill="#0f6e56" font-size="12" font-weight="600">Current</text>
      <text x="719" y="272" text-anchor="middle" fill="#57534e" font-size="11">feeder</text>
      <text x="719" y="290" text-anchor="middle" fill="#185fa5" font-size="11" font-weight="600">this block</text>

      <rect x="764" y="228" width="78" height="78" rx="8" fill="#e7f6ef" stroke="#0f6e56"/>
