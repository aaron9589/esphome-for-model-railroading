<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">What occupies a signal block</title>
  <desc id="desc">A boundary optic occupies both blocks that meet at the signals. A current detector occupies the block it belongs to. A frog optic occupies the junction block whichever leg the train is on.</desc>
  <rect width="960" height="430" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">What occupies a block</text>
    <text x="32" y="58" fill="#57534e" font-size="13">Any one of these is enough. The signal script reads the block, not each board.</text>
    <rect x="32" y="88" width="288" height="210" rx="12" fill="#fffdf8" stroke="#e7e2d8"/>
    <text x="52" y="122" font-size="15" font-weight="600">Boundary optic</text>
    <text x="52" y="156" fill="#57534e" font-size="13">At the signals. A train here</text>
    <text x="52" y="176" fill="#57534e" font-size="13">occupies both blocks that</text>
    <text x="52" y="196" fill="#57534e" font-size="13">meet at that boundary.</text>
    <text x="52" y="262" fill="#0f6e56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">joint/board/right</text>
    <rect x="336" y="88" width="288" height="210" rx="12" fill="#fffdf8" stroke="#e7e2d8"/>
    <text x="356" y="122" font-size="15" font-weight="600">Current detector</text>
    <text x="356" y="156" fill="#57534e" font-size="13">On a boundary, the side you</text>
    <text x="356" y="176" fill="#57534e" font-size="13">chose. On an interim, the</text>
    <text x="356" y="196" fill="#57534e" font-size="13">block that interim sits in.</text>
    <text x="356" y="262" fill="#0f6e56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">detect/board</text>
    <rect x="640" y="88" width="288" height="210" rx="12" fill="#fffdf8" stroke="#e7e2d8"/>
    <text x="660" y="122" font-size="15" font-weight="600">Frog optic</text>
    <text x="660" y="156" fill="#57534e" font-size="13">Under the frog. A train on</text>
    <text x="660" y="176" fill="#57534e" font-size="13">either leg occupies the</text>
    <text x="660" y="196" fill="#57534e" font-size="13">junction block.</text>
    <text x="660" y="262" fill="#0f6e56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">turnout/board</text>
    <rect x="32" y="318" width="896" height="88" rx="12" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="52" y="350" font-size="14" font-weight="600">The block</text>
    <text x="52" y="376" fill="#57534e" font-size="13">Occupied when any detector or optic in it is occupied, or a junction turnout is set against the route.</text>
    <text x="52" y="396" fill="#57534e" font-size="13">Clear when every one of those is clear and the boards are online.</text>
  </g>
</svg>
