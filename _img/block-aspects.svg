<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">How a signal picks an aspect from the blocks ahead</title>
  <desc id="desc">Stop comes from the block the signal protects. Approach and Approach Diverging come from the next block. Advance Approach comes from the one after that. Clear or Dark comes from the block behind.</desc>
  <rect width="960" height="540" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">The signal that protects this block</text>
    <text x="32" y="58" fill="#57534e" font-size="13">It faces the blocks ahead. The first match wins, from the top of this list down.</text>
    <rect x="32" y="84" width="200" height="78" rx="12" fill="#f5f5f4"/>
    <rect x="248" y="84" width="220" height="78" rx="12" fill="#fde8e8" stroke="#b42318"/>
    <rect x="484" y="84" width="220" height="78" rx="12" fill="#faeeda" stroke="#854f0b"/>
    <rect x="720" y="84" width="208" height="78" rx="12" fill="#e8f1fb" stroke="#185fa5"/>
    <g stroke="#a8a29e" stroke-width="3" stroke-linecap="butt">
      <line x1="44" y1="112" x2="220" y2="112"/>
      <line x1="44" y1="124" x2="220" y2="124"/>
    </g>
    <g stroke="#a8a29e" stroke-width="2"><line x1="56" y1="112" x2="56" y2="124"/><line x1="74" y1="112" x2="74" y2="124"/><line x1="92" y1="112" x2="92" y2="124"/><line x1="110" y1="112" x2="110" y2="124"/><line x1="128" y1="112" x2="128" y2="124"/><line x1="146" y1="112" x2="146" y2="124"/><line x1="164" y1="112" x2="164" y2="124"/><line x1="182" y1="112" x2="182" y2="124"/><line x1="200" y1="112" x2="200" y2="124"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
      <line x1="264" y1="112" x2="452" y2="112"/>
      <line x1="264" y1="124" x2="452" y2="124"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="276" y1="112" x2="276" y2="124"/><line x1="294" y1="112" x2="294" y2="124"/><line x1="312" y1="112" x2="312" y2="124"/><line x1="330" y1="112" x2="330" y2="124"/><line x1="348" y1="112" x2="348" y2="124"/><line x1="366" y1="112" x2="366" y2="124"/><line x1="384" y1="112" x2="384" y2="124"/><line x1="402" y1="112" x2="402" y2="124"/><line x1="420" y1="112" x2="420" y2="124"/><line x1="438" y1="112" x2="438" y2="124"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
      <line x1="500" y1="112" x2="688" y2="112"/>
      <line x1="500" y1="124" x2="688" y2="124"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="512" y1="112" x2="512" y2="124"/><line x1="530" y1="112" x2="530" y2="124"/><line x1="548" y1="112" x2="548" y2="124"/><line x1="566" y1="112" x2="566" y2="124"/><line x1="584" y1="112" x2="584" y2="124"/><line x1="602" y1="112" x2="602" y2="124"/><line x1="620" y1="112" x2="620" y2="124"/><line x1="638" y1="112" x2="638" y2="124"/><line x1="656" y1="112" x2="656" y2="124"/><line x1="674" y1="112" x2="674" y2="124"/></g>
    <g stroke="#d32f2f" stroke-width="3" stroke-linecap="butt">
      <line x1="736" y1="112" x2="912" y2="112"/>
      <line x1="736" y1="124" x2="912" y2="124"/>
    </g>
    <g stroke="#d32f2f" stroke-width="2"><line x1="748" y1="112" x2="748" y2="124"/><line x1="766" y1="112" x2="766" y2="124"/><line x1="784" y1="112" x2="784" y2="124"/><line x1="802" y1="112" x2="802" y2="124"/><line x1="820" y1="112" x2="820" y2="124"/><line x1="838" y1="112" x2="838" y2="124"/><line x1="856" y1="112" x2="856" y2="124"/><line x1="874" y1="112" x2="874" y2="124"/><line x1="892" y1="112" x2="892" y2="124"/></g>
    <g transform="translate(214 100) scale(1 1)">
      <circle cx="0" cy="0" r="11" fill="#292524"/>
      <circle cx="0" cy="0" r="5" fill="#f4f1ea"/>
      <polygon points="14,-4 24,0 14,4" fill="#1c1917"/>
    </g>
    <text x="120" y="78" text-anchor="middle" fill="#78716c" font-size="11">the signal stands here</text>
    <text x="132" y="108" text-anchor="middle" fill="#57534e" font-size="12" font-weight="600">Behind</text>
    <text x="358" y="108" text-anchor="middle" fill="#57534e" font-size="12" font-weight="600">This block</text>
    <text x="594" y="108" text-anchor="middle" fill="#57534e" font-size="12" font-weight="600">Next</text>
    <text x="824" y="108" text-anchor="middle" fill="#57534e" font-size="12" font-weight="600">Two ahead</text>
    <rect x="32" y="180" width="200" height="280" rx="12" fill="#f5f5f4"/>
    <text x="132" y="212" text-anchor="middle" fill="#44403c" font-size="15" font-weight="600">Behind</text>
    <text x="132" y="240" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">A train here, and the</text>
    <text x="132" y="260" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">road ahead is clear</text>
    <text x="132" y="280" text-anchor="middle" fill="#0f6e56" font-size="16" font-weight="600">Clear</text>
    <text x="132" y="308" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">Empty, ahead clear,</text>
    <text x="132" y="328" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">lighting on</text>
    <text x="132" y="348" text-anchor="middle" fill="#44403c" font-size="16" font-weight="600">Dark</text>
    <text x="132" y="376" text-anchor="middle" fill="#78716c" font-size="12" font-weight="400">Lighting off stays Clear</text>
    <rect x="248" y="180" width="220" height="280" rx="12" fill="#fde8e8" stroke="#b42318"/>
    <text x="358" y="212" text-anchor="middle" fill="#9f1239" font-size="15" font-weight="600">Protects</text>
    <text x="358" y="240" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">Block topic OCCUPIED</text>
    <text x="358" y="260" text-anchor="middle" fill="#9f1239" font-size="16" font-weight="600">Stop</text>
    <text x="358" y="288" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">Current, optical, or</text>
    <text x="358" y="308" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">turnout against.</text>
    <text x="358" y="328" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">Stop wins over</text>
    <text x="358" y="348" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">the rest.</text>
    <rect x="484" y="180" width="220" height="280" rx="12" fill="#faeeda" stroke="#854f0b"/>
    <text x="594" y="212" text-anchor="middle" fill="#854f0b" font-size="15" font-weight="600">Next</text>
    <text x="594" y="240" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">That topic OCCUPIED</text>
    <text x="594" y="260" text-anchor="middle" fill="#854f0b" font-size="16" font-weight="600">Approach</text>
    <text x="594" y="288" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">Turnout REVERSE,</text>
    <text x="594" y="308" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">and its block clear</text>
    <text x="594" y="328" text-anchor="middle" fill="#854f0b" font-size="16" font-weight="600">Approach Diverging</text>
    <text x="594" y="356" text-anchor="middle" fill="#78716c" font-size="12" font-weight="400">Replaces Approach.</text>
    <rect x="720" y="180" width="208" height="280" rx="12" fill="#e8f1fb" stroke="#185fa5"/>
    <text x="824" y="212" text-anchor="middle" fill="#185fa5" font-size="15" font-weight="600">Two ahead</text>
    <text x="824" y="240" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">OCCUPIED, and the</text>
    <text x="824" y="260" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">nearer blocks</text>
    <text x="824" y="280" text-anchor="middle" fill="#57534e" font-size="13" font-weight="400">are clear</text>
    <text x="824" y="300" text-anchor="middle" fill="#185fa5" font-size="16" font-weight="600">Advance Approach</text>
    <text x="824" y="328" text-anchor="middle" fill="#78716c" font-size="12" font-weight="400">Optional, as are</text>
    <text x="824" y="348" text-anchor="middle" fill="#78716c" font-size="12" font-weight="400">diverging and Dark.</text>
    <text x="32" y="492" fill="#57534e" font-size="13">The signal starts at Stop until the topics it needs have reported. Stop, Approach, and Clear are required.</text>
    <text x="32" y="516" fill="#57534e" font-size="13">Advance Approach, Approach Diverging, and approach lighting are optional. An absolute hold is a later figure.</text>
  </g>
</svg>
