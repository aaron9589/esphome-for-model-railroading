<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">When a published topic counts as clear</title>
  <desc id="desc">A topic is clear only when its board is online, the payload is CLEAR, and a copy arrived within three seconds. Occupied, offline, quiet, and unheard all count as occupied, so a missing module shows Stop.</desc>
  <rect width="960" height="500" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">When a signal trusts a topic</text>
    <text x="32" y="58" fill="#57534e" font-size="13">Clear needs the board online, a CLEAR payload, and a copy within the last three seconds.</text>
    <rect x="32" y="84" width="288" height="300" rx="12" fill="#e7f6ef" stroke="#0f6e56"/>
    <text x="176" y="116" text-anchor="middle" fill="#0f6e56" font-size="13" font-weight="600">Online, fresh, CLEAR</text>
    <rect x="56" y="136" width="240" height="64" rx="8" fill="#fffdf8" stroke="#185fa5"/>
    <text x="176" y="162" text-anchor="middle" font-size="14" font-weight="600">Board</text>
    <text x="176" y="182" text-anchor="middle" fill="#185fa5" font-size="13" font-weight="600">ONLINE</text>
    <rect x="76" y="216" width="200" height="64" rx="8" fill="#fffdf8" stroke="#0f6e56"/>
    <text x="176" y="242" text-anchor="middle" font-size="14" font-weight="600">Topic</text>
    <text x="176" y="262" text-anchor="middle" fill="#0f6e56" font-size="13">CLEAR</text>
    <text x="176" y="312" text-anchor="middle" font-size="18" font-weight="600">Clear</text>
    <text x="176" y="336" text-anchor="middle" fill="#57534e" font-size="13">this input is clear</text>
    <text x="176" y="360" text-anchor="middle" fill="#78716c" font-size="12">from this publisher</text>
    <rect x="336" y="84" width="288" height="300" rx="12" fill="#faeeda" stroke="#854f0b"/>
    <text x="480" y="116" text-anchor="middle" fill="#854f0b" font-size="13" font-weight="600">Online and OCCUPIED</text>
    <rect x="360" y="136" width="240" height="64" rx="8" fill="#fffdf8" stroke="#185fa5"/>
    <text x="480" y="162" text-anchor="middle" font-size="14" font-weight="600">Board</text>
    <text x="480" y="182" text-anchor="middle" fill="#185fa5" font-size="13" font-weight="600">ONLINE</text>
    <rect x="380" y="216" width="200" height="64" rx="8" fill="#fffdf8" stroke="#854f0b"/>
    <text x="480" y="242" text-anchor="middle" font-size="14" font-weight="600">Topic</text>
    <text x="480" y="262" text-anchor="middle" fill="#854f0b" font-size="13">OCCUPIED</text>
    <text x="480" y="312" text-anchor="middle" font-size="18" font-weight="600">Occupied</text>
    <text x="480" y="336" text-anchor="middle" fill="#57534e" font-size="13">train, joint, or turnout</text>
    <text x="480" y="360" text-anchor="middle" fill="#78716c" font-size="12">from this publisher</text>
    <rect x="640" y="84" width="288" height="300" rx="12" fill="#f5f5f4" stroke="#44403c"/>
    <text x="784" y="116" text-anchor="middle" fill="#44403c" font-size="13" font-weight="600">Offline, quiet, or unheard</text>
    <rect x="664" y="136" width="240" height="64" rx="8" fill="#fffdf8" stroke="#185fa5"/>
    <text x="784" y="162" text-anchor="middle" font-size="14" font-weight="600">Board</text>
    <text x="784" y="182" text-anchor="middle" fill="#185fa5" font-size="13" font-weight="600">OFFLINE</text>
    <rect x="684" y="216" width="200" height="64" rx="8" fill="#fffdf8" stroke="#44403c" stroke-dasharray="4 3"/>
    <text x="784" y="242" text-anchor="middle" font-size="14" font-weight="600">Topic</text>
    <text x="784" y="262" text-anchor="middle" fill="#44403c" font-size="13">no fresh copy</text>
    <text x="784" y="312" text-anchor="middle" font-size="18" font-weight="600">Occupied</text>
    <text x="784" y="336" text-anchor="middle" fill="#57534e" font-size="13">the signal holds at Stop</text>
    <text x="784" y="360" text-anchor="middle" fill="#78716c" font-size="12">from this publisher</text>
    <text x="32" y="420" fill="#44403c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">mss/&lt;track&gt;/node/&lt;board&gt;/online</text>
    <text x="380" y="420" fill="#57534e" font-size="13">Birth is ONLINE. The last will is OFFLINE. Both are retained.</text>
    <text x="32" y="448" fill="#57534e" font-size="13">Block, joint, diverging, and postcard topics are published again about once a second.</text>
    <text x="32" y="472" fill="#57534e" font-size="13">Three seconds without a copy counts as occupied, even if an older CLEAR is still retained.</text>
  </g>
</svg>
