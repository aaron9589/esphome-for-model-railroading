<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">What one signal reads</title>
  <desc id="desc">The board publishes detect, boundaryOptic, turnoutOptic, and diverging. Those become the four words of the ahead postcard. The signal reads BLOCK as Stop, NEXT as Approach, AFTER as Advance Approach, and DIVERGING with NEXT as Approach Diverging.</desc>
  <rect width="960" height="560" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">
    <text x="32" y="36" font-size="18" font-weight="600">What one signal reads</text>
    <text x="32" y="58" fill="#57534e" font-size="13">The board publishes what it measured. The postcard carries that to the signal facing this way.</text>
    <rect x="16" y="76" width="928" height="196" rx="16" fill="#e7f6ef"/>
    <text x="36" y="104" fill="#0f6e56" font-size="15" font-weight="600">1. Published</text>
    <text x="52" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#44403c">detect/board/right</text>
    <text x="280" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">1 OCCUPIED or 1 CLEAR</text>
    <text x="52" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#44403c">boundaryOptic/board</text>
    <text x="280" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">1 OCCUPIED or 1 CLEAR</text>
    <text x="52" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#44403c">turnoutOptic/board</text>
    <text x="280" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">1 OCCUPIED or 1 CLEAR</text>
    <text x="52" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#44403c">diverging/board</text>
    <text x="280" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">1 ACTIVE or 1 INACTIVE</text>
    <text x="36" y="248" fill="#57534e" font-size="13">Any occupied detector or optic in the block sets BLOCK. Diverging stays its own word.</text>
    <rect x="16" y="288" width="928" height="252" rx="16" fill="#e8f1fb"/>
    <text x="36" y="316" fill="#185fa5" font-size="15" font-weight="600">2. Read from the postcard ahead</text>
    <text x="36" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#44403c">ahead/neighbour</text>
    <text x="220" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">1  BLOCK  NEXT  AFTER  DIVERGING</text>
    <text x="52" y="384" font-size="14">BLOCK occupied</text>
    <text x="280" y="384" font-size="14" font-weight="600" fill="#b42318">Stop</text>
    <text x="52" y="410" font-size="14">NEXT occupied</text>
    <text x="280" y="410" font-size="14" font-weight="600" fill="#854f0b">Approach</text>
    <text x="52" y="436" font-size="14">AFTER occupied</text>
    <text x="280" y="436" font-size="14" font-weight="600" fill="#854f0b">Advance Approach</text>
    <text x="52" y="462" font-size="14">NEXT occupied and DIVERGING active</text>
    <text x="420" y="462" font-size="14" font-weight="600" fill="#854f0b">Approach Diverging</text>
    <text x="36" y="508" fill="#57534e" font-size="13">The first match wins, from Stop downward. Held on an absolute mast is Stop before any of these.</text>
  </g>
</svg>
