    id: kiama_up_xover_sensor
    name: "Kiama - Up XOver"
    filters:
      - delayed_on_off: 500ms
    on_press:
      then:
        - logger.log:
            format: "Kiama/Up XOver | OCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Kiama/Up XOver"
            payload: ACTIVE
            retain: false
            qos: 2
    on_release:
      then:
        - logger.log:
            format: "Kiama/Up XOver | UNOCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Kiama/Up XOver"
            payload: INACTIVE
            retain: false
            qos: 2
