number:
  - platform: template
    name: "Kiama - Up Loop Normal Position"
    id: kiama_up_loop_servo_endpoint_normal
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: kiama_up_loop_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Kiama - Up Loop Normal Backoff"
    id: kiama_up_loop_servo_endpoint_normal_backoff
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: kiama_up_loop_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Kiama - Up Loop Reverse Position"
    id: kiama_up_loop_servo_endpoint_reverse
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: kiama_up_loop_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Kiama - Up Loop Reverse Backoff"
    id: kiama_up_loop_servo_endpoint_reverse_backoff
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: kiama_up_loop_servo
            level: !lambda 'return x / 100.0;'

output:
  - platform: pca9685
    id: kiama_up_loop_output
    channel: 0

servo:
  - id: kiama_up_loop_servo
    output: kiama_up_loop_output
    auto_detach_time: 0s
    transition_length: 10s

script:
  - id: kiama_up_loop_throw_closed
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(kiama_up_loop_thrown) = false;
          kiama_up_loop_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Kiama/Up Loop -> CLOSED (normal)"
          level: INFO
          tag: point_control
      - servo.write:
          id: kiama_up_loop_servo
          level: !lambda 'return id(kiama_up_loop_servo_endpoint_normal).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: kiama_up_loop_servo
          level: !lambda 'return id(kiama_up_loop_servo_endpoint_normal_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: "trains/track/sensor/Kiama/Up Loop/Thrown"
                payload: "INACTIVE"
                retain: true
                qos: 2
  - id: kiama_up_loop_throw_thrown
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(kiama_up_loop_thrown) = true;
          kiama_up_loop_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Kiama/Up Loop -> THROWN (reverse)"
          level: INFO
          tag: point_control
      - servo.write:
          id: kiama_up_loop_servo
          level: !lambda 'return id(kiama_up_loop_servo_endpoint_reverse).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: kiama_up_loop_servo
          level: !lambda 'return id(kiama_up_loop_servo_endpoint_reverse_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: "trains/track/sensor/Kiama/Up Loop/Thrown"
                payload: "ACTIVE"
                retain: true
                qos: 2

text_sensor:
  - platform: mqtt_subscribe
    name: "Kiama - Up Loop last command"
    id: kiama_up_loop
    topic: "trains/track/turnout/Kiama/Up Loop"
    on_value:
      - if:
          condition:
            text_sensor.state:
              id: kiama_up_loop
              state: 'THROWN'
          then:
            - script.execute:
                id: kiama_up_loop_throw_thrown
                announce: true
      - if:
          condition:
            text_sensor.state:
              id: kiama_up_loop
              state: 'CLOSED'
          then:
            - script.execute:
                id: kiama_up_loop_throw_closed
                announce: true
