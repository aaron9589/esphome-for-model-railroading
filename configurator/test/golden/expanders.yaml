#
# Generated by ESPHome for Model Railroading Configurator
# Requires ESPHome >= 2026.9.0
# Re-import this file into the configurator to edit — avoid hand-editing if you plan to re-import.
# This file contains Wi-Fi, MQTT, and hotspot credentials — do not commit it to a public repo.

esphome:
  name: expander-board
  min_version: "2026.9.0"
  # Wait 1-6 seconds so boards do not all join Wi-Fi and MQTT together.
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            int random_delay = 1000 + (esphome::random_uint32() % 5000);
            ESP_LOGI("main", "Delaying boot for %d milliseconds", random_delay);
            int delay_step = 100;
            for (int i = 0; i < random_delay / delay_step; i++) {
              delay(delay_step);
              App.feed_wdt();
            }
            delay(random_delay % delay_step);
            ESP_LOGI("main", "Boot delay completed, continuing initialization");
    - priority: -200.0
      then:
        - if:
            condition:
              lambda: 'return id(kiama_up_loop_thrown);'
            then:
              - script.execute:
                  id: kiama_up_loop_throw_thrown
                  announce: false
            else:
              - script.execute:
                  id: kiama_up_loop_throw_closed
                  announce: false

esp32:
  variant: esp32

logger:
  level: DEBUG

api:
  encryption:
    key: "Z29sZGVuLWZpeHR1cmUta2V5LW5vdC1hLXNlY3JldCE="
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: layout-wifi
  password: not-a-real-password
  power_save_mode: none
  ap:
    ssid: "expander-board setup"
    password: GoldenFixtureHotspot

captive_portal:

mqtt:
  broker: layout-mqtt.local
  id: mqtt_server
  discovery: false
  # Empty prefix: ESPHome will not publish or subscribe its own entity topics.
  topic_prefix: null
  reboot_timeout: 0s
  on_connect:
    - mqtt.publish:
        topic: "trains/track/sensor/Kiama/Up XOver"
        payload: !lambda |-
          return id(kiama_up_xover_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2
    - mqtt.publish:
        topic: "trains/track/sensor/Int 2 East"
        payload: !lambda |-
          return id(int_2_east_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2
    - mqtt.publish:
        topic: "trains/track/sensor/Int 2 West"
        payload: !lambda |-
          return id(int_2_west_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2
    - mqtt.publish:
        topic: "trains/track/sensor/Yard 3"
        payload: !lambda |-
          return id(yard_3_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2
    - mqtt.publish:
        topic: "trains/track/sensor/Kiama/Up Loop/Thrown"
        payload: !lambda |-
          return id(kiama_up_loop_thrown) ? "ACTIVE" : "INACTIVE";
        retain: true
        qos: 2

button:
  - platform: restart
    id: reboot_esp
    name: "Restart Board"

web_server:
  local: true
  ota: false

i2c:
  - id: i2c_1
    sda: GPIO21
    scl: GPIO22
    scan: true
  - id: i2c_2
    sda: GPIO25
    scl: GPIO26
    scan: true

pca9685:
  - id: pca9685_1
    i2c_id: i2c_1
    frequency: 50Hz

mcp23017:
  - id: mcp23017_1
    address: 0x20
    i2c_id: i2c_1
  - id: mcp23017_2
    address: 0x27
    i2c_id: i2c_2

globals:
  - id: kiama_up_loop_thrown
    type: bool
    restore_value: true
    initial_value: "false"

