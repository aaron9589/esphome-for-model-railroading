  - platform: gpio
    pin: GPIO13
    id: station_loop_open_light_1
    name: "Station - Loop open light 1"
    internal: true

script:
  - id: station_loop_throw_closed
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(station_loop_thrown) = false;
          station_loop_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Station/Loop -> CLOSED (normal)"
          level: INFO
          tag: point_control
      - switch.turn_on: station_loop_closed_light_1
      - switch.turn_off: station_loop_open_light_1
      - servo.write:
          id: station_loop_servo
          level: !lambda 'return id(station_loop_servo_endpoint_normal).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: station_loop_servo
          level: !lambda 'return id(station_loop_servo_endpoint_normal_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/Station/Loop/Thrown
                payload: "INACTIVE"
                retain: true
                qos: 2
  - id: station_loop_throw_thrown
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(station_loop_thrown) = true;
          station_loop_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Station/Loop -> THROWN (reverse)"
          level: INFO
          tag: point_control
      - switch.turn_off: station_loop_closed_light_1
      - switch.turn_on: station_loop_open_light_1
      - servo.write:
          id: station_loop_servo
          level: !lambda 'return id(station_loop_servo_endpoint_reverse).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: station_loop_servo
          level: !lambda 'return id(station_loop_servo_endpoint_reverse_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/Station/Loop/Thrown
                payload: "ACTIVE"
                retain: true
                qos: 2
  - id: station_loop_latch_1
    mode: queued
    parameters:
      force: bool
    then:
      - wait_until:
          condition:
            lambda: 'return id(station_loop_button_1).has_state() && !id(station_loop_throw_closed).is_running() && !id(station_loop_throw_thrown).is_running();'
      - lambda: |-
          bool want = id(station_loop_button_1).state;
          // A remote lock holds the point where it is.
          if (id(station_loop_locked)) want = id(station_loop_thrown);
          bool moving = want != id(station_loop_thrown);
          if (!moving && !force) return;
          if (want) id(station_loop_throw_thrown).execute(moving);
          else id(station_loop_throw_closed).execute(moving);
  - id: station_siding_throw_closed
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(station_siding_thrown) = false;
          station_siding_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Station/Siding -> CLOSED (normal)"
          level: INFO
          tag: point_control
      - servo.write:
          id: station_siding_servo
          level: !lambda 'return id(station_siding_servo_endpoint_normal).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: station_siding_servo
          level: !lambda 'return id(station_siding_servo_endpoint_normal_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/Station/Siding/Thrown
                payload: "INACTIVE"
                retain: true
                qos: 2
  - id: station_siding_throw_thrown
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(station_siding_thrown) = true;
          station_siding_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Station/Siding -> THROWN (reverse)"
          level: INFO
          tag: point_control
      - servo.write:
          id: station_siding_servo
          level: !lambda 'return id(station_siding_servo_endpoint_reverse).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: station_siding_servo
          level: !lambda 'return id(station_siding_servo_endpoint_reverse_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/Station/Siding/Thrown
                payload: "ACTIVE"
                retain: true
                qos: 2
  - id: station_siding_latch_1
    mode: queued
    parameters:
      force: bool
    then:
      - wait_until:
          condition:
            lambda: 'return id(station_siding_button_1).has_state() && !id(station_siding_throw_closed).is_running() && !id(station_siding_throw_thrown).is_running();'
      - lambda: |-
          bool want = !id(station_siding_button_1).state;
          bool moving = want != id(station_siding_thrown);
          if (!moving && !force) return;
          if (want) id(station_siding_throw_thrown).execute(moving);
          else id(station_siding_throw_closed).execute(moving);
  - id: station_dock_throw_closed
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(station_dock_thrown) = false;
          station_dock_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Station/Dock -> CLOSED (normal)"
          level: INFO
          tag: point_control
      - servo.write:
          id: station_dock_servo
          level: !lambda 'return id(station_dock_servo_endpoint_normal).state / 100.0;'
      - delay: 2s
