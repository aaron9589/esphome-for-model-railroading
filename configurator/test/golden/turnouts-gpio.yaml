text_sensor:
  - platform: mqtt_subscribe
    name: "Station - Loop last command"
    id: station_loop
    topic: trains/track/turnout/Station/Loop
    on_value:
      - if:
          condition:
            and:
              - text_sensor.state:
                  id: station_loop
                  state: 'THROWN'
              - lambda: 'return !id(station_loop_locked);'
          then:
            - script.execute:
                id: station_loop_throw_thrown
                announce: true
      - if:
          condition:
            and:
              - text_sensor.state:
                  id: station_loop
                  state: 'CLOSED'
              - lambda: 'return !id(station_loop_locked);'
          then:
            - script.execute:
                id: station_loop_throw_closed
                announce: true
  - platform: mqtt_subscribe
    name: "Station - Loop lock"
    id: station_loop_lock
    internal: true
    topic: trains/track/turnout/Station/Loop/Lock
    on_value:
      - if:
          condition:
            text_sensor.state:
              id: station_loop_lock
              state: 'LOCKED'
          then:
            - lambda: 'id(station_loop_locked) = true;'
            - logger.log:
                format: "Station/Loop lock -> LOCKED"
                level: INFO
                tag: point_control
            - mqtt.publish:
                topic: trains/track/sensor/Station/Loop/Locked
                payload: !lambda |-
                  return id(station_loop_locked) ? "ACTIVE" : "INACTIVE";
                retain: true
                qos: 2
      - if:
          condition:
            text_sensor.state:
              id: station_loop_lock
              state: 'UNLOCKED'
          then:
            - lambda: |-
                bool was_locked = id(station_loop_locked);
                id(station_loop_locked) = false;
                if (was_locked) id(station_loop_latch_1).execute(false);
            - logger.log:
                format: "Station/Loop lock -> UNLOCKED"
                level: INFO
                tag: point_control
            - mqtt.publish:
                topic: trains/track/sensor/Station/Loop/Locked
                payload: !lambda |-
                  return id(station_loop_locked) ? "ACTIVE" : "INACTIVE";
                retain: true
                qos: 2
  - platform: mqtt_subscribe
    name: "Station - Siding last command"
    id: station_siding
    topic: trains/track/turnout/Station/Siding
    on_value:
      - if:
          condition:
            text_sensor.state:
              id: station_siding
              state: 'THROWN'
          then:
            - script.execute:
                id: station_siding_throw_thrown
                announce: true
      - if:
          condition:
            text_sensor.state:
              id: station_siding
              state: 'CLOSED'
          then:
            - script.execute:
                id: station_siding_throw_closed
                announce: true
  - platform: mqtt_subscribe
    name: "Station - Dock last command"
    id: station_dock
    topic: trains/track/turnout/Station/Dock
    on_value:
      - if:
          condition:
            text_sensor.state:
              id: station_dock
              state: 'THROWN'
          then:
            - script.execute:
                id: station_dock_throw_thrown
                announce: true
      - if:
          condition:
            text_sensor.state:
              id: station_dock
              state: 'CLOSED'
          then:
            - script.execute:
                id: station_dock_throw_closed
                announce: true
