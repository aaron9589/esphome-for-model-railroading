text_sensor:
  - platform: mqtt_subscribe
    name: "Platform 1 Starter"
    id: platform_1_starter
    internal: true
    topic: "trains/track/signalmast/Platform 1 Starter"
    on_value:
      - lambda: |-
          // JMRI sends "<aspect>; Lit or Unlit; Held or Unheld".
          std::string name = x.substr(0, x.find(';'));
          while (!name.empty() && name.back() == ' ') name.pop_back();
          const bool unlit = x.find("; Unlit") != std::string::npos;
          const bool held = x.find("; Held") != std::string::npos;
          int pick = -1;
          if (x == "R292") pick = 0;
          else if (x == "R285") pick = 1;
          else if (x == "R281") pick = 2;
          else if (x == "R290") pick = 3;
          else if (unlit) pick = -2;
          else if (held) pick = 0;
          else if (name == "R292") pick = 0;
          else if (name == "R285") pick = 1;
          else if (name == "R281") pick = 2;
          else if (name == "R290") pick = 3;
          if (pick == -1) return;
          id(platform_1_starter_aspect) = pick;
          id(platform_1_starter_show).execute(true);
