#
# Generated by ESPHome for Model Railroading Configurator
# Requires ESPHome >= 2026.9.0
# Re-import this file into the configurator to edit — avoid hand-editing if you plan to re-import.
# This file contains Wi-Fi, MQTT, and hotspot credentials — do not commit it to a public repo.

esphome:
  name: led-signal-board
  min_version: "2026.9.0"
  # Wait 1-6 seconds so boards do not all join Wi-Fi and MQTT together.
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            int random_delay = 1000 + (esphome::random_uint32() % 5000);
            ESP_LOGI("main", "Delaying boot for %d milliseconds", random_delay);
            int delay_step = 100;
            for (int i = 0; i < random_delay / delay_step; i++) {
              delay(delay_step);
              App.feed_wdt();
            }
            delay(random_delay % delay_step);
            ESP_LOGI("main", "Boot delay completed, continuing initialization");
    - priority: -150.0
      then:
        - globals.set:
            id: platform_1_starter_aspect
            value: '0'
        - script.execute:
            id: platform_1_starter_show
            restart_effects: true

esp32:
  variant: esp32

logger:
  level: DEBUG

api:
  encryption:
    key: "Z29sZGVuLWZpeHR1cmUta2V5LW5vdC1hLXNlY3JldCE="
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: layout-wifi
  password: not-a-real-password
  power_save_mode: none
  ap:
    ssid: "led-signal-board setup"
    password: GoldenFixtureHotspot

captive_portal:

mqtt:
  broker: layout-mqtt.local
  id: mqtt_server
  discovery: false
  # Empty prefix: ESPHome will not publish or subscribe its own entity topics.
  topic_prefix: null
  reboot_timeout: 0s
  on_connect:
    - mqtt.publish:
        topic: "trains/track/sensor/Platform 1"
        payload: !lambda |-
          return id(platform_1_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2

button:
  - platform: restart
    id: reboot_esp
    name: "Restart Board"

web_server:
  local: true
  ota: false

globals:
  - id: platform_1_starter_aspect
    type: int
    restore_value: false
    initial_value: '-1'

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
    id: platform_1_sensor
    name: "Platform 1"
    filters:
      - delayed_on_off: 500ms
    on_press:
      then:
        - logger.log:
            format: "Platform 1 | OCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Platform 1"
            payload: ACTIVE
            retain: false
            qos: 2
    on_release:
      then:
        - logger.log:
            format: "Platform 1 | UNOCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Platform 1"
            payload: INACTIVE
            retain: false
            qos: 2

