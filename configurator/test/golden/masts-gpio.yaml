script:
  - id: platform_1_starter_show
    mode: restart
    parameters:
      restart_effects: bool
    then:
      - if:
          condition:
            lambda: 'return id(platform_1_starter_aspect) == -2;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Platform 1 Starter | Dark"
                      level: INFO
                      tag: signal_mast
            - light.turn_off: platform_1_starter_lamp_0
            - light.turn_off: platform_1_starter_lamp_1
            - light.turn_off: platform_1_starter_lamp_2
      - if:
          condition:
            lambda: 'return id(platform_1_starter_aspect) == 0;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Platform 1 Starter | Stop"
                      level: INFO
                      tag: signal_mast
            - light.turn_on:
                id: platform_1_starter_lamp_0
                brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'
                effect: "None"
            - light.turn_off: platform_1_starter_lamp_1
            - light.turn_off: platform_1_starter_lamp_2
      - if:
          condition:
            lambda: 'return id(platform_1_starter_aspect) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Platform 1 Starter | Caution"
                      level: INFO
                      tag: signal_mast
            - light.turn_off: platform_1_starter_lamp_0
            - light.turn_on:
                id: platform_1_starter_lamp_1
                brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'
                effect: "None"
            - light.turn_off: platform_1_starter_lamp_2
      - if:
          condition:
            lambda: 'return id(platform_1_starter_aspect) == 2;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Platform 1 Starter | Clear"
                      level: INFO
                      tag: signal_mast
            - light.turn_off: platform_1_starter_lamp_0
            - light.turn_off: platform_1_starter_lamp_1
            - light.turn_on:
                id: platform_1_starter_lamp_2
                brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'
                effect: "None"
      - if:
          condition:
            lambda: 'return id(platform_1_starter_aspect) == 3;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Platform 1 Starter | Restricted"
                      level: INFO
                      tag: signal_mast
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - light.turn_on:
                      id: platform_1_starter_lamp_0
                      brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'
                      effect: Blink
            - light.turn_off: platform_1_starter_lamp_1
            - light.turn_off: platform_1_starter_lamp_2

