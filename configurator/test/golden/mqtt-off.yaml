#
# Generated by ESPHome for Model Railroading Configurator
# Requires ESPHome >= 2026.9.0
# Re-import this file into the configurator to edit — avoid hand-editing if you plan to re-import.
# This file contains Wi-Fi, MQTT, and hotspot credentials — do not commit it to a public repo.

esphome:
  name: standalone-board
  min_version: "2026.9.0"
  # Wait 1-6 seconds so boards do not all join Wi-Fi and MQTT together.
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            int random_delay = 1000 + (esphome::random_uint32() % 5000);
            ESP_LOGI("main", "Delaying boot for %d milliseconds", random_delay);
            int delay_step = 100;
            for (int i = 0; i < random_delay / delay_step; i++) {
              delay(delay_step);
              App.feed_wdt();
            }
            delay(random_delay % delay_step);
            ESP_LOGI("main", "Boot delay completed, continuing initialization");
    - priority: -200.0
      then:
        - if:
            condition:
              lambda: 'return id(loop_points_thrown);'
            then:
              - script.execute:
                  id: loop_points_throw_thrown
                  announce: false
            else:
              - script.execute:
                  id: loop_points_throw_closed
                  announce: false

esp32:
  variant: esp32

logger:
  level: DEBUG

api:
  encryption:
    key: "Z29sZGVuLWZpeHR1cmUta2V5LW5vdC1hLXNlY3JldCE="
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: layout-wifi
  password: not-a-real-password
  power_save_mode: none
  ap:
    ssid: "standalone-board setup"
    password: GoldenFixtureHotspot

captive_portal:

button:
  - platform: restart
    id: reboot_esp
    name: "Restart Board"

web_server:
  local: true
  ota: false

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

pca9685:
  frequency: 50Hz

globals:
  - id: loop_points_thrown
    type: bool
    restore_value: true
    initial_value: "false"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
    id: loop_track_sensor
    name: "Loop Track"
    filters:
      - delayed_on_off: 500ms
    on_press:
      then:
        - logger.log:
            format: "Loop Track | OCCUPIED"
            level: INFO
            tag: block_sensor
    on_release:
      then:
        - logger.log:
            format: "Loop Track | UNOCCUPIED"
            level: INFO
            tag: block_sensor
  - platform: gpio
    pin:
      number: GPIO4
      inverted: true
      mode:
        input: true
        pullup: true
    id: loop_points_button_1
    name: "Loop Points button 1"
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - if:
            condition:
              not:
                or:
                  - script.is_running:
                      id: loop_points_throw_closed
                  - script.is_running:
                      id: loop_points_throw_thrown
            then:
              - if:
                  condition:
                    lambda: 'return id(loop_points_thrown);'
                  then:
                    - script.execute:
                        id: loop_points_throw_closed
                        announce: true
                  else:
                    - script.execute:
                        id: loop_points_throw_thrown
                        announce: true

number:
  - platform: template
    name: "Loop Points Normal Position"
    id: loop_points_servo_endpoint_normal
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: loop_points_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Loop Points Normal Backoff"
    id: loop_points_servo_endpoint_normal_backoff
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: loop_points_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Loop Points Reverse Position"
    id: loop_points_servo_endpoint_reverse
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: loop_points_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Loop Points Reverse Backoff"
    id: loop_points_servo_endpoint_reverse_backoff
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: loop_points_servo
            level: !lambda 'return x / 100.0;'

output:
  - platform: pca9685
    id: loop_points_output
    channel: 0

servo:
  - id: loop_points_servo
    output: loop_points_output
    auto_detach_time: 0s
    transition_length: 10s

switch:
  - platform: gpio
    pin: GPIO16
    id: loop_points_closed_light_1
    name: "Loop Points closed light 1"
    internal: true
  - platform: gpio
    pin: GPIO13
    id: loop_points_open_light_1
    name: "Loop Points open light 1"
    internal: true

script:
  - id: loop_points_throw_closed
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(loop_points_thrown) = false;
          loop_points_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Loop Points -> CLOSED (normal)"
          level: INFO
          tag: point_control
      - switch.turn_on: loop_points_closed_light_1
      - switch.turn_off: loop_points_open_light_1
      - servo.write:
          id: loop_points_servo
          level: !lambda 'return id(loop_points_servo_endpoint_normal).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: loop_points_servo
          level: !lambda 'return id(loop_points_servo_endpoint_normal_backoff).state / 100.0;'
  - id: loop_points_throw_thrown
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(loop_points_thrown) = true;
          loop_points_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Loop Points -> THROWN (reverse)"
          level: INFO
          tag: point_control
      - switch.turn_off: loop_points_closed_light_1
      - switch.turn_on: loop_points_open_light_1
      - servo.write:
          id: loop_points_servo
          level: !lambda 'return id(loop_points_servo_endpoint_reverse).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: loop_points_servo
          level: !lambda 'return id(loop_points_servo_endpoint_reverse_backoff).state / 100.0;'
