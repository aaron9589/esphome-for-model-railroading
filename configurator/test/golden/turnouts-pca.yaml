text_sensor:
  - platform: mqtt_subscribe
    name: "Junction - Up Loop last command"
    id: junction_up_loop
    topic: "trains/track/turnout/Junction/Up Loop"
    on_value:
      - if:
          condition:
            and:
              - text_sensor.state:
                  id: junction_up_loop
                  state: 'THROWN'
              - lambda: 'return !id(junction_up_loop_locked);'
          then:
            - script.execute:
                id: junction_up_loop_throw_thrown
                announce: true
      - if:
          condition:
            and:
              - text_sensor.state:
                  id: junction_up_loop
                  state: 'CLOSED'
              - lambda: 'return !id(junction_up_loop_locked);'
          then:
            - script.execute:
                id: junction_up_loop_throw_closed
                announce: true
  - platform: mqtt_subscribe
    name: "Junction - Up Loop lock"
    id: junction_up_loop_lock
    internal: true
    topic: "trains/track/turnout/Junction/Up Loop/Lock"
    on_value:
      - if:
          condition:
