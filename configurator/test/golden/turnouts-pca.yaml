          then:
            - mqtt.publish:
                topic: trains/track/sensor/Junction/Siding/Thrown
                payload: "INACTIVE"
                retain: true
                qos: 2
  - id: junction_siding_throw_thrown
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(junction_siding_thrown) = true;
          junction_siding_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Junction/Siding -> THROWN (reverse)"
          level: INFO
          tag: point_control
      - servo.write:
          id: junction_siding_servo
          level: !lambda 'return id(junction_siding_servo_endpoint_reverse).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: junction_siding_servo
          level: !lambda 'return id(junction_siding_servo_endpoint_reverse_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: trains/track/sensor/Junction/Siding/Thrown
                payload: "ACTIVE"
                retain: true
                qos: 2
