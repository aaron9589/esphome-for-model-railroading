          level: !lambda 'return id(goods_shed_servo_endpoint_normal_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: trains/goods/shed/Thrown
                payload: "INACTIVE"
                retain: true
                qos: 2
  - id: goods_shed_throw_thrown
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(goods_shed_thrown) = true;
          goods_shed_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Goods Shed -> THROWN (reverse)"
