# Requires ESPHome >= 2026.9.0
# Re-import this file into the configurator to edit — avoid hand-editing if you plan to re-import.
# This file contains Wi-Fi, MQTT, and hotspot credentials — do not commit it to a public repo.

esphome:
  name: junction-board
  min_version: "2026.9.0"
  # Wait 1-6 seconds so boards do not all join Wi-Fi and MQTT together.
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            int random_delay = 1000 + (esphome::random_uint32() % 5000);
            ESP_LOGI("main", "Delaying boot for %d milliseconds", random_delay);
            int delay_step = 100;
            for (int i = 0; i < random_delay / delay_step; i++) {
              delay(delay_step);
              App.feed_wdt();
            }
            delay(random_delay % delay_step);
            ESP_LOGI("main", "Boot delay completed, continuing initialization");
    - priority: -200.0
      then:
        # Each servo waits 0.2-1s so they do not all start together.
        - delay: !lambda 'return 200 + (esphome::random_uint32() % 800);'
        - if:
            condition:
              lambda: 'return id(junction_up_loop_thrown);'
            then:
              - script.execute:
                  id: junction_up_loop_throw_thrown
                  announce: false
            else:
              - script.execute:
                  id: junction_up_loop_throw_closed
                  announce: false
        - delay: !lambda 'return 200 + (esphome::random_uint32() % 800);'
        - if:
            condition:
              lambda: 'return id(junction_down_loop_thrown);'
            then:
              - script.execute:
                  id: junction_down_loop_throw_thrown
                  announce: false
            else:
              - script.execute:
                  id: junction_down_loop_throw_closed
                  announce: false
        - delay: !lambda 'return 200 + (esphome::random_uint32() % 800);'
        - if:
            condition:
              lambda: 'return id(junction_siding_thrown);'
            then:
              - script.execute:
                  id: junction_siding_throw_thrown
                  announce: false
            else:
              - script.execute:
                  id: junction_siding_throw_closed
                  announce: false
        - delay: !lambda 'return 200 + (esphome::random_uint32() % 800);'
        - if:
            condition:
              lambda: 'return id(goods_shed_thrown);'
            then:
              - script.execute:
                  id: goods_shed_throw_thrown
                  announce: false
            else:
              - script.execute:
                  id: goods_shed_throw_closed
                  announce: false

