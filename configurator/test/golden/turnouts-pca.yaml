  - id: junction_up_loop_throw_closed
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(junction_up_loop_thrown) = false;
          junction_up_loop_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Junction/Up Loop -> CLOSED (normal)"
          level: INFO
          tag: point_control
      - switch.turn_on: junction_up_loop_closed_light_1
      - switch.turn_off: junction_up_loop_open_light_1
      - servo.write:
          id: junction_up_loop_servo
          level: !lambda 'return id(junction_up_loop_servo_endpoint_normal).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: junction_up_loop_servo
          level: !lambda 'return id(junction_up_loop_servo_endpoint_normal_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
