#
# Generated by ESPHome for Model Railroading Configurator
# Requires ESPHome >= 2026.9.0
# Re-import this file into the configurator to edit — avoid hand-editing if you plan to re-import.
# This file contains Wi-Fi, MQTT, and hotspot credentials — do not commit it to a public repo.

esphome:
  name: old-board
  min_version: "2026.9.0"
  # Wait 1-6 seconds so boards do not all join Wi-Fi and MQTT together.
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            int random_delay = 1000 + (esphome::random_uint32() % 5000);
            ESP_LOGI("main", "Delaying boot for %d milliseconds", random_delay);
            int delay_step = 100;
            for (int i = 0; i < random_delay / delay_step; i++) {
              delay(delay_step);
              App.feed_wdt();
            }
            delay(random_delay % delay_step);
            ESP_LOGI("main", "Boot delay completed, continuing initialization");
    - priority: -200.0
      then:
        - if:
            condition:
              lambda: 'return id(old_points_thrown);'
            then:
              - script.execute:
                  id: old_points_throw_thrown
                  announce: false
            else:
              - script.execute:
                  id: old_points_throw_closed
                  announce: false
    - priority: -100.0
      then:
        - light.turn_on:
            id: old_mast_strip
            brightness: 100%
            red: 0%
            green: 0%
            blue: 0%

esp32:
  variant: esp32

logger:
  level: DEBUG

api:
  encryption:
    key: "Z29sZGVuLWZpeHR1cmUta2V5LW5vdC1hLXNlY3JldCE="
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: layout-wifi
  password: not-a-real-password
  power_save_mode: none
  ap:
    ssid: "old-board setup"
    password: GoldenFixtureHotspot

captive_portal:

mqtt:
  broker: layout-mqtt.local
  id: mqtt_server
  discovery: false
  # Empty prefix: ESPHome will not publish or subscribe its own entity topics.
  topic_prefix: null
  reboot_timeout: 0s
  on_connect:
    - mqtt.publish:
        topic: "trains/track/sensor/Old Block"
        payload: !lambda |-
          return id(old_block_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2
    - mqtt.publish:
        topic: "trains/track/sensor/Old Points/Thrown"
        payload: !lambda |-
          return id(old_points_thrown) ? "ACTIVE" : "INACTIVE";
        retain: true
        qos: 2

button:
  - platform: restart
    id: reboot_esp
    name: "Restart Board"

web_server:
  local: true
  ota: false

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

pca9685:
  frequency: 50Hz

globals:
  - id: old_points_thrown
    type: bool
    restore_value: true
    initial_value: "false"
  - id: old_mast_aspect
    type: int
    restore_value: false
    initial_value: '-1'

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
    id: old_block_sensor
    name: "Old Block"
    filters:
      - delayed_on_off: 500ms
    on_press:
      then:
        - logger.log:
            format: "Old Block | OCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Old Block"
            payload: ACTIVE
            retain: false
            qos: 2
    on_release:
      then:
        - logger.log:
            format: "Old Block | UNOCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Old Block"
            payload: INACTIVE
            retain: false
            qos: 2
  - platform: gpio
    pin:
      number: GPIO4
      inverted: true
      mode:
        input: true
        pullup: true
    id: old_points_button_1
    name: "Old Points button 1"
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - if:
            condition:
              not:
                or:
                  - script.is_running:
                      id: old_points_throw_closed
                  - script.is_running:
                      id: old_points_throw_thrown
            then:
              - if:
                  condition:
                    lambda: 'return id(old_points_thrown);'
                  then:
                    - script.execute:
                        id: old_points_throw_closed
                        announce: true
                  else:
                    - script.execute:
                        id: old_points_throw_thrown
                        announce: true

number:
  - platform: template
    name: "Old Points Normal Position"
    id: old_points_servo_endpoint_normal
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: old_points_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Old Points Normal Backoff"
    id: old_points_servo_endpoint_normal_backoff
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: old_points_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Old Points Reverse Position"
    id: old_points_servo_endpoint_reverse
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: old_points_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Old Points Reverse Backoff"
    id: old_points_servo_endpoint_reverse_backoff
    min_value: -50
    max_value: 50
    initial_value: 0
    restore_value: true
    optimistic: true
    step: 0.1
    set_action:
      then:
        - servo.write:
            id: old_points_servo
            level: !lambda 'return x / 100.0;'
  - platform: template
    name: "Signal - Brightness"
    id: signal_steady_bright
    min_value: 0.1
    max_value: 100
    initial_value: 44.6
    restore_value: true
    optimistic: true
    step: 0.1
    unit_of_measurement: "%"
    mode: slider
    set_action:
      then:
        - script.execute:
            id: old_mast_show
            restart_effects: false
  - platform: template
    name: "Signal - Blink - Brightness"
    id: signal_blink_bright
    min_value: 0.1
    max_value: 100
    initial_value: 66.6
    restore_value: true
    optimistic: true
    step: 0.1
    unit_of_measurement: "%"
    mode: slider
  - platform: template
    name: "Signal - Pulse - Brightness"
    id: signal_pulse_peak
    min_value: 0.1
    max_value: 100
    initial_value: 88.5
    restore_value: true
    optimistic: true
    step: 0.1
    unit_of_measurement: "%"
    mode: slider
  - platform: template
    name: "Signal - Blink - On"
    id: signal_blink_lit
    min_value: 0.1
    max_value: 5
    initial_value: 0.6
    restore_value: true
    optimistic: true
    step: 0.1
    unit_of_measurement: "s"
    mode: slider
  - platform: template
    name: "Signal - Blink - Off"
    id: signal_blink_dark
    min_value: 0.1
    max_value: 5
    initial_value: 0.2
    restore_value: true
    optimistic: true
    step: 0.1
    unit_of_measurement: "s"
    mode: slider
  - platform: template
    name: "Signal - Pulse - Rate"
    id: signal_pulse_span
    min_value: 0.1
    max_value: 10
    initial_value: 0.5
    restore_value: true
    optimistic: true
    step: 0.1
    unit_of_measurement: "s"
    mode: slider
  - platform: template
    name: "Signal - Pulse - Gap"
    id: signal_pulse_wait
    min_value: 0.1
    max_value: 5
    initial_value: 0.3
    restore_value: true
    optimistic: true
    step: 0.1
    unit_of_measurement: "s"
    mode: slider

output:
  - platform: pca9685
    id: old_points_output
    channel: 0

servo:
  - id: old_points_servo
    output: old_points_output
    auto_detach_time: 0s
    transition_length: 10s

switch:
  - platform: gpio
    pin: GPIO13
    id: old_points_closed_light_1
    name: "Old Points closed light 1"
    internal: true

script:
  - id: old_points_throw_closed
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(old_points_thrown) = false;
          old_points_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Old Points -> CLOSED (normal)"
          level: INFO
          tag: point_control
      - switch.turn_on: old_points_closed_light_1
      - servo.write:
          id: old_points_servo
          level: !lambda 'return id(old_points_servo_endpoint_normal).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: old_points_servo
          level: !lambda 'return id(old_points_servo_endpoint_normal_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: "trains/track/sensor/Old Points/Thrown"
                payload: "INACTIVE"
                retain: true
                qos: 2
  - id: old_points_throw_thrown
    mode: restart
    parameters:
      announce: bool
    then:
      - lambda: |-
          id(old_points_thrown) = true;
          old_points_thrown->update();
          global_preferences->sync();
      - logger.log:
          format: "Old Points -> THROWN (reverse)"
          level: INFO
          tag: point_control
      - switch.turn_off: old_points_closed_light_1
      - servo.write:
          id: old_points_servo
          level: !lambda 'return id(old_points_servo_endpoint_reverse).state / 100.0;'
      - delay: 2s
      - servo.write:
          id: old_points_servo
          level: !lambda 'return id(old_points_servo_endpoint_reverse_backoff).state / 100.0;'
      - if:
          condition:
            lambda: 'return announce;'
          then:
            - mqtt.publish:
                topic: "trains/track/sensor/Old Points/Thrown"
                payload: "ACTIVE"
                retain: true
                qos: 2
  - id: old_mast_show
    mode: restart
    parameters:
      restart_effects: bool
    then:
      - if:
          condition:
            lambda: 'return id(old_mast_aspect) == -2;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Old Mast | Dark"
                      level: INFO
                      tag: signal_mast
            - light.addressable_set:
                id: old_mast_strip
                range_from: 0
                range_to: 1
                color: 0x000000
      - if:
          condition:
            lambda: 'return id(old_mast_aspect) == 0;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Old Mast | Stop"
                      level: INFO
                      tag: signal_mast
            - light.addressable_set:
                id: old_mast_strip
                range_from: 0
                range_to: 0
                color: 0xff0000
                color_brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'
            - light.addressable_set:
                id: old_mast_strip
                range_from: 1
                range_to: 1
                color: 0x000000
      - if:
          condition:
            lambda: 'return id(old_mast_aspect) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return restart_effects;'
                then:
                  - logger.log:
                      format: "Old Mast | Clear"
                      level: INFO
                      tag: signal_mast
            - light.addressable_set:
                id: old_mast_strip
                range_from: 0
                range_to: 0
                color: 0x000000
            - light.addressable_set:
                id: old_mast_strip
                range_from: 1
                range_to: 1
                color: 0x1fff87
                color_brightness: !lambda 'return id(signal_steady_bright).state / 100.0;'

light:
  - platform: esp32_rmt_led_strip
    id: old_mast_strip
    internal: true
    pin: GPIO16
    num_leds: 2
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 0s

text_sensor:
  - platform: mqtt_subscribe
    name: "Old Points last command"
    id: old_points
    topic: "trains/track/turnout/Old Points"
    on_value:
      - if:
          condition:
            text_sensor.state:
              id: old_points
              state: 'THROWN'
          then:
            - script.execute:
                id: old_points_throw_thrown
                announce: true
      - if:
          condition:
            text_sensor.state:
              id: old_points
              state: 'CLOSED'
          then:
            - script.execute:
                id: old_points_throw_closed
                announce: true
  - platform: mqtt_subscribe
    name: "Old Mast"
    id: old_mast
    internal: true
    topic: "trains/track/signalmast/Old Mast"
    on_value:
      - lambda: |-
          // JMRI sends "<aspect>; Lit or Unlit; Held or Unheld".
          std::string name = x.substr(0, x.find(';'));
          while (!name.empty() && name.back() == ' ') name.pop_back();
          const bool unlit = x.find("; Unlit") != std::string::npos;
          const bool held = x.find("; Held") != std::string::npos;
          int pick = -1;
          if (x == "Stop") pick = 0;
          else if (x == "Clear") pick = 1;
          else if (unlit) pick = -2;
          else if (held) pick = 0;
          else if (name == "Stop") pick = 0;
          else if (name == "Clear") pick = 1;
          if (pick == -1) return;
          id(old_mast_aspect) = pick;
          id(old_mast_show).execute(true);
