light:
  - platform: esp32_rmt_led_strip
    id: kjn_42_26_strip
    internal: true
    pin: GPIO16
    num_leds: 6
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 0s
  - platform: partition
    id: kjn_42_26_lamp_2
    name: "KJN-42.26 Lower"
    internal: true
    default_transition_length: 0s
    segments:
      - id: kjn_42_26_strip
        from: 2
        to: 2
    effects:
      - addressable_lambda:
          name: "Blink Amber"
          update_interval: 16ms
          lambda: |-
            static uint32_t started = 0;
            if (initial_run) started = millis();
            float on_s = id(signal_blink_lit).state;
            float off_s = id(signal_blink_dark).state;
            if (on_s < 0.05f) on_s = 0.05f;
            if (off_s < 0.05f) off_s = 0.05f;
            const uint32_t on_ms = uint32_t(on_s * 1000.0f);
            const uint32_t off_ms = uint32_t(off_s * 1000.0f);
            const uint32_t elapsed = (millis() - started) % (on_ms + off_ms);
            const float level = elapsed < on_ms ? id(signal_blink_bright).state / 100.0f : 0.0f;
            Color px(0, 0, 0);
            if (level > 0.0f) px = Color(uint8_t(255 * level), uint8_t(200 * level), uint8_t(0 * level));
            for (int32_t i = 0; i < it.size(); i++) it[i] = px;
      - addressable_lambda:
          name: "Pulse Amber"
          update_interval: 16ms
          lambda: |-
            static uint32_t last_ms = 0;
            static float phase = 0.0f;
            float pulse_s = id(signal_pulse_span).state;
            float pause_s = id(signal_pulse_wait).state;
            if (pulse_s < 0.05f) pulse_s = 0.05f;
            if (pause_s < 0.0f) pause_s = 0.0f;
            const float cycle_s = pulse_s + pause_s;
            const uint32_t now = millis();
            if (initial_run) {
              last_ms = now;
              phase = 0.0f;
            }
            const float dt = float(now - last_ms) / 1000.0f;
            last_ms = now;
            phase += dt / cycle_s;
            phase -= floorf(phase);
            const float t = phase * cycle_s;
            const float half = pulse_s * 0.5f;
            float wave = 0.0f;
            if (t < half) wave = 1.0f - t / half;
            else if (t >= half + pause_s) wave = (t - half - pause_s) / half;
            const float level = (id(signal_pulse_peak).state / 100.0f) * wave;
            Color px(0, 0, 0);
            if (level > 0.0f) px = Color(uint8_t(255 * level), uint8_t(200 * level), uint8_t(0 * level));
            for (int32_t i = 0; i < it.size(); i++) it[i] = px;
  - platform: esp32_rmt_led_strip
    id: dwarf_yard_strip
    internal: true
    pin: GPIO17
    num_leds: 2
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 0s
  - platform: partition
    id: dwarf_yard_lamp_1
    name: "Dwarf (Yard) Bottom"
    internal: true
    default_transition_length: 0s
    segments:
      - id: dwarf_yard_strip
        from: 1
        to: 1
    effects:
      - addressable_lambda:
          name: "Blink Red"
          update_interval: 16ms
          lambda: |-
            static uint32_t started = 0;
            if (initial_run) started = millis();
            float on_s = id(signal_blink_lit).state;
            float off_s = id(signal_blink_dark).state;
            if (on_s < 0.05f) on_s = 0.05f;
            if (off_s < 0.05f) off_s = 0.05f;
            const uint32_t on_ms = uint32_t(on_s * 1000.0f);
            const uint32_t off_ms = uint32_t(off_s * 1000.0f);
            const uint32_t elapsed = (millis() - started) % (on_ms + off_ms);
            const float level = elapsed < on_ms ? id(signal_blink_bright).state / 100.0f : 0.0f;
            Color px(0, 0, 0);
            if (level > 0.0f) px = Color(uint8_t(255 * level), uint8_t(0 * level), uint8_t(0 * level));
            for (int32_t i = 0; i < it.size(); i++) it[i] = px;

text_sensor:
  - platform: mqtt_subscribe
    name: KJN-42.26
    id: kjn_42_26
    internal: true
    topic: trains/track/signalmast/KJN-42.26
    on_value:
      - lambda: |-
          // JMRI sends "<aspect>; Lit or Unlit; Held or Unheld".
          std::string name = x.substr(0, x.find(';'));
          while (!name.empty() && name.back() == ' ') name.pop_back();
          const bool unlit = x.find("; Unlit") != std::string::npos;
          const bool held = x.find("; Held") != std::string::npos;
          int pick = -1;
          if (x == "R292; Lit; Unheld") pick = 0;
          else if (x == "R292") pick = 0;
          else if (x == "R285") pick = 1;
          else if (x == "R282") pick = 2;
          else if (x == "R281") pick = 3;
          else if (x == "R290") pick = 4;
          else if (unlit) pick = -2;
          else if (held) pick = 0;
          else if (name == "R292") pick = 0;
          else if (name == "R285") pick = 1;
          else if (name == "R282") pick = 2;
          else if (name == "R281") pick = 3;
          else if (name == "R290") pick = 4;
          if (pick == -1) return;
          id(kjn_42_26_aspect) = pick;
          id(kjn_42_26_show).execute(true);
  - platform: mqtt_subscribe
    name: "Dwarf (Yard)"
    id: dwarf_yard
    internal: true
    topic: "trains/track/signalmast/Dwarf (Yard)"
    on_value:
      - lambda: |-
          // JMRI sends "<aspect>; Lit or Unlit; Held or Unheld".
          std::string name = x.substr(0, x.find(';'));
          while (!name.empty() && name.back() == ' ') name.pop_back();
          const bool unlit = x.find("; Unlit") != std::string::npos;
          const bool held = x.find("; Held") != std::string::npos;
          int pick = -1;
          if (x == "R292") pick = 0;
          else if (x == "R290") pick = 1;
          else if (unlit) pick = -2;
          else if (held) pick = 0;
          else if (name == "R292") pick = 0;
          else if (name == "R290") pick = 1;
          if (pick == -1) return;
          id(dwarf_yard_aspect) = pick;
          id(dwarf_yard_show).execute(true);
