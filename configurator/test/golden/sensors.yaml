esphome:
  name: sensor-board
  min_version: "2026.9.0"
  # Wait 1-6 seconds so boards do not all join Wi-Fi and MQTT together.
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            int random_delay = 1000 + (esphome::random_uint32() % 5000);
            ESP_LOGI("main", "Delaying boot for %d milliseconds", random_delay);
            int delay_step = 100;
            for (int i = 0; i < random_delay / delay_step; i++) {
              delay(delay_step);
              App.feed_wdt();
            }
            delay(random_delay % delay_step);
            ESP_LOGI("main", "Boot delay completed, continuing initialization");

esp32:
  variant: esp32

logger:
  level: DEBUG

api:
  encryption:
    key: "Z29sZGVuLWZpeHR1cmUta2V5LW5vdC1hLXNlY3JldCE="
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: layout-wifi
  password: not-a-real-password
  power_save_mode: none
  ap:
    ssid: "sensor-board setup"
    password: GoldenFixtureHotspot

captive_portal:

mqtt:
  broker: layout-mqtt.local
  id: mqtt_server
  discovery: false
  # Empty prefix: ESPHome will not publish or subscribe its own entity topics.
  topic_prefix: null
  reboot_timeout: 0s
  on_connect:
    - mqtt.publish:
        topic: "trains/track/sensor/Kiama/Up Main"
        payload: !lambda |-
          return id(kiama_up_main_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2
    - mqtt.publish:
        topic: "trains/track/sensor/Kiama/Down Main"
        payload: !lambda |-
          return id(kiama_down_main_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2
    - mqtt.publish:
        topic: "trains/track/sensor/Yard Ladder"
        payload: !lambda |-
          return id(yard_ladder_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2
    - mqtt.publish:
        topic: trains/fiddle/occupancy
        payload: !lambda |-
          return id(fiddle_yard_sensor).state ? "ACTIVE" : "INACTIVE";
        retain: false
        qos: 2

button:
  - platform: restart
    id: reboot_esp
    name: "Restart Board"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
    id: kiama_up_main_sensor
    name: "Kiama - Up Main"
    filters:
      - delayed_on_off: 500ms
    on_press:
      then:
        - logger.log:
            format: "Kiama/Up Main | OCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Kiama/Up Main"
            payload: ACTIVE
            retain: false
            qos: 2
    on_release:
      then:
        - logger.log:
            format: "Kiama/Up Main | UNOCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Kiama/Up Main"
            payload: INACTIVE
            retain: false
            qos: 2
  - platform: gpio
    pin:
      number: GPIO27
      inverted: false
      mode:
        input: true
    id: kiama_down_main_sensor
    name: "Kiama - Down Main"
    filters:
      - delayed_on_off: 250ms
    on_press:
      then:
        - logger.log:
            format: "Kiama/Down Main | OCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Kiama/Down Main"
            payload: ACTIVE
            retain: false
            qos: 2
    on_release:
      then:
        - logger.log:
            format: "Kiama/Down Main | UNOCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Kiama/Down Main"
            payload: INACTIVE
            retain: false
            qos: 2
  - platform: gpio
    pin:
      number: GPIO34
      inverted: true
      mode:
        input: true
    id: yard_ladder_sensor
    name: "Yard Ladder"
    filters:
      - delayed_on_off: 500ms
    on_press:
      then:
        - logger.log:
            format: "Yard Ladder | OCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Yard Ladder"
            payload: ACTIVE
            retain: false
            qos: 2
    on_release:
      then:
        - logger.log:
            format: "Yard Ladder | UNOCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: "trains/track/sensor/Yard Ladder"
            payload: INACTIVE
            retain: false
            qos: 2
  - platform: gpio
    pin:
      number: GPIO35
      inverted: true
      mode:
        input: true
    id: fiddle_yard_sensor
    name: "Fiddle Yard"
    filters:
      - delayed_on_off: 1s
    on_press:
      then:
        - logger.log:
            format: "Fiddle Yard | OCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: trains/fiddle/occupancy
            payload: ACTIVE
            retain: false
            qos: 2
    on_release:
      then:
        - logger.log:
            format: "Fiddle Yard | UNOCCUPIED"
            level: INFO
            tag: block_sensor
        - mqtt.publish:
            topic: trains/fiddle/occupancy
            payload: INACTIVE
            retain: false
            qos: 2
