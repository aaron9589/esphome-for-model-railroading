<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#111827">
  <title>Sketch of the Field Logic track plan page</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#cbd5e1"/>
    </pattern>
  </defs>
  <rect width="960" height="640" fill="#f3f4f6"/>

  <!-- steps -->
  <g transform="translate(20,16)">
    <rect width="920" height="52" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <g fill="#15803d">
      <text x="24" y="32">✓ 1 Draw</text>
      <text x="150" y="32">✓ 2 Sensors</text>
      <text x="300" y="32">✓ 3 Signals</text>
    </g>
    <rect x="440" y="10" width="140" height="32" rx="16" fill="#1d4ed8"/>
    <text x="510" y="31" text-anchor="middle" fill="#fff" font-weight="600">4 Behaviour</text>
    <text x="620" y="32" fill="#6b7280">5 Try it</text>
    <text x="730" y="32" fill="#6b7280">6 Download</text>
  </g>

  <!-- plan -->
  <g transform="translate(20,84)">
    <rect width="920" height="320" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="20" y="30" font-weight="700" fill="#6b7280">YOUR TRACK</text>
    <g font-size="13">
      <rect x="680" y="12" width="66" height="28" rx="6" fill="#fff" stroke="#9ca3af"/><text x="713" y="31" text-anchor="middle">Draw</text>
      <rect x="754" y="12" width="66" height="28" rx="6" fill="#fff" stroke="#9ca3af"/><text x="787" y="31" text-anchor="middle">Erase</text>
      <rect x="828" y="12" width="72" height="28" rx="6" fill="#dbeafe" stroke="#1d4ed8"/><text x="864" y="31" text-anchor="middle">Select</text>
    </g>
    <rect x="20" y="52" width="880" height="248" rx="8" fill="url(#grid)" stroke="#e5e7eb"/>

    <!-- selected section -->
    <rect x="336" y="128" width="248" height="76" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="460" y="147" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="600">One train at a time</text>

    <!-- track: detected solid, undetected dashed -->
    <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 110 H270 L340 170" stroke="#374151"/>
      <path d="M340 170 H580" stroke="#1d4ed8"/>
      <path d="M580 170 L650 110 H860" stroke="#9ca3af" stroke-dasharray="10 10"/>
      <path d="M580 170 L650 230 H860" stroke="#374151"/>
      <path d="M340 170 L270 230 H60" stroke="#9ca3af" stroke-dasharray="10 10"/>
    </g>
    <!-- direction arrows -->
    <g fill="#6b7280">
      <path d="M90 101 l16 9 -16 9z"/>
      <path d="M830 101 l16 9 -16 9z"/>
      <path d="M830 221 l-16 9 16 9z"/>
      <path d="M90 221 l-16 9 16 9z"/>
    </g>
    <!-- block breaks -->
    <g stroke="#111827" stroke-width="3">
      <line x1="340" y1="156" x2="340" y2="184"/>
      <line x1="580" y1="156" x2="580" y2="184"/>
    </g>
    <!-- joins -->
    <g fill="#1d4ed8"><circle cx="340" cy="170" r="4"/><circle cx="580" cy="170" r="4"/></g>

    <!-- signals -->
    <g>
      <line x1="306" y1="92" x2="306" y2="126" stroke="#1f2937" stroke-width="3"/>
      <rect x="297" y="64" width="18" height="32" rx="5" fill="#1f2937"/>
      <circle cx="306" cy="73" r="5" fill="#ff0000"/><circle cx="306" cy="87" r="5" fill="#4b5563"/>
      <text x="289" y="84" text-anchor="end" font-size="13">Left Bridge ▶</text>

      <line x1="614" y1="214" x2="614" y2="248" stroke="#1f2937" stroke-width="3"/>
      <rect x="605" y="244" width="18" height="32" rx="5" fill="#1f2937"/>
      <circle cx="614" cy="253" r="5" fill="#ff0000"/><circle cx="614" cy="267" r="5" fill="#4b5563"/>
      <text x="631" y="265" font-size="13">◀ Right Bridge</text>
    </g>

    <!-- block labels -->
    <g text-anchor="middle" font-weight="600">
      <text x="170" y="96">Left</text>
      <text x="460" y="194">Bridge</text>
      <text x="760" y="256">Right</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#6b7280">
      <text x="760" y="96">no sensor</text>
      <text x="170" y="256">no sensor</text>
    </g>
  </g>

  <!-- selection panel -->
  <g transform="translate(20,420)">
    <rect width="560" height="156" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="20" y="30" font-weight="700">Bridge: one train at a time</text>
    <text x="20" y="56" fill="#6b7280" font-size="13">Entrances found on your drawing:</text>
    <text x="32" y="80">Left Bridge, for a train waiting in Left</text>
    <text x="32" y="102">Right Bridge, for a train waiting in Right</text>
    <text x="20" y="134" fill="#1d4ed8" font-size="13">▸ More options</text>
    <text x="540" y="134" text-anchor="end" fill="#b91c1c" font-size="13">Remove</text>
  </g>
  <g transform="translate(596,420)">
    <rect width="344" height="156" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="20" y="30" font-weight="700">Explain: Left Bridge</text>
    <g font-size="13">
      <text x="20" y="58">Shows Clear when a train has been in</text>
      <text x="20" y="76">Left for half a second, the Bridge is</text>
      <text x="20" y="94">free and Bridge is clear.</text>
      <text x="20" y="124">Otherwise it shows Stop.</text>
    </g>
  </g>

  <rect x="20" y="592" width="920" height="34" rx="10" fill="#fff" stroke="#e5e7eb"/>
  <text x="40" y="614" fill="#6b7280">▸ Advanced: your own rules, sections, buttons, and what the plan has made</text>
</svg>
